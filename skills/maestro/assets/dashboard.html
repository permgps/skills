<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro</title>
<!--
  The human view of a прогон. Specification: docs/spec/dashboard.md.

  One file, no build step, no network. Every style and every script is inline
  because the page is copied into a target project and opened from file://,
  where a sibling load is blocked and an absent CDN is indistinguishable from
  a broken page. Its only input is state.js.

  Every number here is derived, never stored. A duration written into the state
  goes stale silently; one computed at render time cannot.
-->
<style>
  /*
    Three states, and CSS is the source of truth for all three.

    Before anyone has pressed anything there is no `data-theme` attribute at
    all, and the media query governs — that is what makes the page follow the
    screen it was opened on. A press writes the attribute, and from then on the
    attribute wins in both directions. JavaScript sets the attribute and reads
    nothing back: a theme decided in script would be a second place to look the
    day these colours are changed.
  */
  :root,
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fbfbfa;
    --panel: #ffffff;
    --line: #e3e2df;
    --ghost: #ececea;
    --ink: #1b1a17;
    --muted: #6d6a63;
    --accent: #2f6f4f;
    --info: #2c5a8a;
    --fix: #6b3f8a;
    --warn: #8a5a12;
    --fail: #9b2c2c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --bg: #17181a;
      --panel: #1f2124;
      --line: #33363b;
      --ghost: #2a2d31;
      --ink: #e8e6e1;
      --muted: #9a978f;
      --accent: #6cc38f;
      --info: #7aa9d8;
      --fix: #b28ad0;
      --warn: #d8a657;
      --fail: #e07a72;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181a;
    --panel: #1f2124;
    --line: #33363b;
    --ghost: #2a2d31;
    --ink: #e8e6e1;
    --muted: #9a978f;
    --accent: #6cc38f;
    --info: #7aa9d8;
    --fix: #b28ad0;
    --warn: #d8a657;
    --fail: #e07a72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  h2 {
    font-size: .72rem; margin: 0 0 .6rem; color: var(--muted);
    font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  }
  header { margin-bottom: 1rem; }
  main { display: grid; gap: 1rem; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1rem;
  }
  #dials { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px;
    padding: .1rem .6rem; font-size: .78rem; color: var(--muted);
    white-space: nowrap;
  }
  .chip-done { color: var(--accent); border-color: var(--accent); }
  .chip-running { color: var(--warn); border-color: var(--warn); }
  .chip-review { color: var(--info); border-color: var(--info); }
  .chip-repair { color: var(--fix); border-color: var(--fix); }
  .chip-failed { color: var(--fail); border-color: var(--fail); }
  #notice {
    margin: .75rem 0 0;
    white-space: pre-line;
    padding: .6rem .8rem;
    border-left: 3px solid var(--warn);
    background: var(--panel);
    color: var(--warn);
  }
  #notice.alarm {
    border-left-color: var(--fail);
    color: var(--fail);
  }
  /* --- the i beside a region, and the one popover they all fill --- */
  .info {
    margin-left: .45rem; padding: 0; width: 1.15em; height: 1.15em;
    border: 1px solid var(--line); border-radius: 50%;
    background: none; color: var(--muted);
    font: inherit; font-size: .72rem; line-height: 1;
    cursor: pointer; vertical-align: middle;
  }
  .info:hover, .info:focus-visible { color: var(--ink); border-color: var(--muted); }
  /* A row's i is quieter than a heading's: eight of them in a column would
     otherwise read as eight warnings. */
  .row .info { margin-left: .4rem; font-size: .62rem; border-color: transparent; }
  .row:hover .info, .row .info:focus-visible { border-color: var(--line); }
  #explain {
    position: absolute; z-index: 10; max-width: 24rem;
    padding: .7rem .85rem;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink);
    font-size: .82rem; line-height: 1.5;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .22);
  }
  #explain p { margin: 0 0 .5rem; }
  #explain p:last-child { margin-bottom: 0; }
  #explain .what { color: var(--muted); }
  #problem {
    padding: 1rem;
    border: 1px solid var(--fail);
    border-radius: 8px;
    color: var(--fail);
    background: var(--panel);
  }

  /* --- the whole road, in one bar --- */
  #progress .head { display: flex; justify-content: space-between; align-items: baseline; }
  #progress-percent { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { display: flex; background: var(--ghost); border-radius: 999px; height: .5rem; overflow: hidden; margin: .5rem 0 .4rem; }
  /* The rounded ends belong to the track, which clips them, so a bar of two
     segments meets in a flat seam instead of two facing bulges. */
  .bar > i { display: block; height: 100%; background: var(--ink); }
  /* Work in flight is not work accepted, and it takes the tone this page
     already uses for everything not yet settled. */
  .bar > i.flight { background: var(--muted); }
  .sub { color: var(--muted); font-size: .85rem; margin: 0; }

  /* --- the eight cards --- */
  #cards {
    display: grid; gap: 1rem; padding: 0; border: 0; background: none;
    grid-template-columns: repeat(2, 1fr);
  }
  /* Two rows of four on anything wide enough; two columns on a phone. */
  @media (min-width: 62rem) { #cards { grid-template-columns: repeat(4, 1fr); } }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: .9rem 1rem; min-height: 7.5rem;
  }
  .card .value { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* A range is two numbers and a gap; at the headline size it wraps mid-phrase. */
  #estimate { font-size: 1.25rem; }
  .card .value small { font-size: .95rem; font-weight: 400; color: var(--muted); }
  .card .stage-name { font-size: 1.25rem; font-weight: 600; }
  .ring { display: block; margin: .2rem 0; }
  .ring circle { fill: none; stroke-width: 9; }

  /* --- rows shared by stages, requirements and gates --- */
  .row {
    display: grid;
    grid-template-columns: minmax(7rem, auto) 1fr auto auto;
    gap: .75rem;
    align-items: baseline;
    padding: .3rem 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row .status, .row .clock, .row .count { color: var(--muted); font-size: .9rem; }
  .row .clock, .row .count { font-variant-numeric: tabular-nums; }
  .stage-active .name, .task-running .name { color: var(--accent); font-weight: 600; }
  .stage-failed .name, .stage-failed .status,
  .gate-failed .name, .gate-failed .status { color: var(--fail); }
  .stage-skipped .name, .stage-skipped .status { color: var(--muted); }
  .gate-passed .status { color: var(--accent); }
  .note { color: var(--muted); font-size: .85rem; margin: -.1rem 0 .3rem 0; }
  /* Geometry only. The tone is the render's decision and it is always stated:
     a list that fell through to the quiet colour would be a failure drawn as
     settled, which is the defect this pair replaced, inverted. */
  .findings { margin: .25rem 0 .75rem 1rem; font-size: .9rem; }
  .findings-fail { color: var(--fail); }
  .findings-quiet { color: var(--muted); }
  .findings-toggle {
    display: block; margin: .25rem 0 .6rem 1rem; padding: 0;
    background: none; border: 0; font: inherit; font-size: .9rem;
    color: var(--muted); text-align: left; cursor: pointer;
  }
  .findings-toggle:hover, .findings-toggle:focus-visible { color: var(--ink); }
  .empty, .total { color: var(--muted); margin: .25rem 0 0; }

  /* --- the build, grouped by wave --- */
  .wave-name {
    font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: .9rem 0 .35rem;
  }
  .wave-name:first-child { margin-top: 0; }
  .task {
    display: grid; grid-template-columns: 2.2rem 1fr 3.5rem;
    gap: .6rem; align-items: center; padding: .12rem 0;
  }
  .task .id { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
  .task .mins { text-align: right; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .track { background: var(--ghost); border-radius: 4px; overflow: hidden; }
  .track > .fill {
    display: flex; justify-content: space-between; gap: .5rem;
    padding: .18rem .5rem; border-radius: 4px; color: #fff;
  }
  .track > .fill.queued { background: none; color: var(--muted); border: 1px dashed var(--line); }
  .track > .fill .phase { opacity: .85; font-size: .8rem; }
  #build-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; }
  /* A row that opens says so on hover and on focus, and nowhere louder. */
  .opens { cursor: pointer; border-radius: 4px; }
  .opens:hover, .opens:focus-visible { background: var(--ghost); outline: none; }
  /* The critical path is a mark at the row's edge, in the tone the page uses
     for work in flight: it says where the time goes, not that anything failed. */
  .task.critical .id { color: var(--warn); font-weight: 600; }
  .task.critical .id::before { content: "◆ "; font-size: .7em; }
  .detail {
    margin: .2rem 0 .6rem 2.8rem; padding: 0; list-style: none;
    font-size: .85rem; color: var(--muted);
  }
  .detail li { padding: .05rem 0; overflow-wrap: anywhere; }
  .row .name .quote { color: var(--ink); }
  .row .name .title { display: block; color: var(--muted); font-size: .85rem; }
  .untraced { margin-left: .5rem; font-size: .8rem; }
  .untraced-fail { color: var(--fail); }
  .untraced-quiet { color: var(--muted); }

  /* --- what only the user can settle --- */
  .group-name {
    font-size: .8rem; font-weight: 600; margin: .8rem 0 .25rem; color: var(--ink);
  }
  h4.group-name { font-weight: 400; color: var(--muted); margin: .4rem 0 .15rem 1rem; }
  #handover .group-name:first-child { margin-top: 0; }
  .group { margin: 0 0 .3rem 1rem; padding-left: 1rem; font-size: .9rem; }
  .group li { overflow-wrap: anywhere; }
  /* The two view controls: the reader's own, and nothing to do with the прогон. */
  #controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
    margin: .6rem 0 0;
  }
  .switch {
    display: inline-flex; border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden; background: var(--panel);
  }
  .switch button {
    font: inherit; font-size: .78rem; line-height: 1;
    padding: .3rem .55rem; border: 0; background: none; color: var(--muted);
    cursor: pointer;
  }
  .switch button[aria-pressed="true"] { background: var(--ghost); color: var(--ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1 id="run-title">Maestro</h1>
  <div id="dials" data-region="dials" data-region-label="dials"></div>
  <div id="controls">
    <div class="switch" id="theme-switch">
      <button type="button" data-theme-choice="light"></button>
      <button type="button" data-theme-choice="dark"></button>
    </div>
    <div class="switch" id="language-switch">
      <button type="button" data-language-choice="ru">RU</button>
      <button type="button" data-language-choice="en">EN</button>
    </div>
  </div>
  <p id="notice" hidden></p>
</header>

<p id="problem" hidden></p>

<main id="regions">

  <section id="progress" data-region="progress">
    <div class="head">
      <h2 data-label="progress"></h2>
      <b id="progress-percent">—</b>
    </div>
    <div class="bar"><i id="progress-fill" style="width:0%"></i></div>
    <p class="sub" id="progress-sub"></p>
  </section>

  <section id="cards">
    <div class="card" data-region="coverage">
      <h2 data-label="coverage"></h2>
      <svg class="ring" viewBox="0 0 80 80" width="72" height="72" aria-hidden="true">
        <circle cx="40" cy="40" r="34" stroke="var(--ghost)"></circle>
        <circle id="coverage-arc" cx="40" cy="40" r="34" stroke="var(--accent)"
                stroke-linecap="round" transform="rotate(-90 40 40)"
                stroke-dasharray="213.6" stroke-dashoffset="213.6"></circle>
      </svg>
      <div class="value"><span id="coverage-percent">—</span><small>%</small></div>
      <p class="sub" id="coverage-sub"></p>
    </div>

    <div class="card" data-region="stage">
      <h2 data-label="stage"></h2>
      <div class="stage-name" id="stage-name">—</div>
      <p class="sub"><span id="stage-position"></span> · <span id="stage-clock">—</span></p>
    </div>

    <div class="card" data-region="elapsed">
      <h2 data-label="elapsed"></h2>
      <div class="value" id="run-clock">—</div>
      <p class="sub" id="run-median"></p>
      <p class="sub" id="run-calendar"></p>
    </div>

    <div class="card" data-region="estimate">
      <h2 data-label="estimate"></h2>
      <div class="value" id="estimate">—</div>
      <p class="sub" id="estimate-sub"></p>
    </div>

    <div class="card" data-region="tasks">
      <h2 data-label="tasks"></h2>
      <div class="value"><span id="tasks-done">—</span><small id="tasks-total"></small></div>
      <div class="bar"><i id="tasks-fill" style="width:0%"></i><i id="tasks-flight" class="flight" style="width:0%"></i></div>
      <p class="sub" id="tasks-sub"></p>
      <p class="sub" id="tasks-budget"></p>
    </div>

    <div class="card" data-region="debt">
      <h2 data-label="debt"></h2>
      <div class="value" id="debt-count">—</div>
      <p class="sub" id="debt-sub"></p>
    </div>

    <div class="card" data-region="tests">
      <h2 data-label="tests"></h2>
      <div class="value" id="tests-count">—</div>
      <p class="sub" id="tests-sub"></p>
    </div>

    <div class="card" data-region="requirements">
      <h2 data-label="requirements"></h2>
      <div class="value" id="req-count">—</div>
      <p class="sub" id="req-sub"></p>
    </div>
  </section>

  <section data-region="handover"><h2 data-label="handover"></h2><div id="handover"></div></section>

  <section data-region="stages"><h2 data-label="stages"></h2><div id="stages"></div></section>

  <section data-region="build">
    <h2 data-label="build"></h2>
    <div id="build-chips"></div>
    <div id="tasks"></div>
  </section>

  <section data-region="requirement-list">
    <h2 data-label="requirement-list"></h2>
    <div id="requirements"></div>
    <div id="requirement-rows"></div>
    <div id="requirement-folds"></div>
  </section>
  <section data-region="gates"><h2 data-label="gates"></h2><div id="gates"></div></section>
</main>

<div id="explain" hidden></div>

<script id="logic">
// Pure logic, no DOM. Kept separable on purpose: scripts/validate/dashboard-logic.test.ts
// evaluates exactly this block in a node:vm context, which is the only way to
// test a browser page in a repository with no runtime dependencies.
globalThis.MAESTRO_LOGIC = (function () {
  'use strict';

  var KNOWN_CONTRACT_VERSION = 7;

  // The run directory grammar of contract 7, copied from
  // skills/maestro/tools/runtime/state/paths.mts because this page imports
  // nothing; scripts/validate/dashboard-integrity.ts fails the build when the
  // two copies differ. The page reads the start date out of it and nothing else.
  var RUN_DIR_PATTERN = /^(\d{4}-\d{2}-\d{2})-([a-z0-9]+(?:-[a-z0-9]+)*)(--wip)?$/;

  // Mirrors docs/spec/phases.md. scripts/validate/dashboard-integrity.ts fails
  // the build when this set or any label below drifts from vocabulary.md.
  var STAGE_ORDER = [
    'preflight', 'manifest', 'briefing', 'spec',
    'plan', 'build', 'review', 'acceptance'
  ];

  /**
   * Every word the page shows, nested by language and by nothing else.
   *
   * One root, two branches, the same key set under each. That shape is the
   * whole guarantee: scripts/validate/dashboard-integrity.ts walks
   * `Object.keys(L10N)` and holds each branch to its own column of
   * vocabulary.md, so a language cannot be forgotten by omission — there is no
   * name to forget, only a branch that is either complete or reported. A pair
   * of flat `STAGE_LABEL` / `STAGE_LABEL_EN` constants would have left the
   * checker knowing eight names and the ninth shipping unchecked.
   *
   * `UI` holds the sentences the view composes rather than the values it looks
   * up. They are here for the same reason the labels are: a sentence built in
   * the view out of a number and a word would be a Russian sentence with no
   * English twin and nothing to notice its absence.
   */
  var L10N = {
    ru: {
      STAGE_LABEL: {
        preflight: 'Подготовка',
        manifest: 'Требования',
        briefing: 'Брифинг',
        spec: 'Спецификация',
        plan: 'План',
        build: 'Разработка',
        review: 'Ревью',
        acceptance: 'Приёмка'
      },
      STAGE_STATUS: {
        pending: 'Ожидает', active: 'Идёт', done: 'Готово',
        failed: 'Сбой', skipped: 'Пропущен'
      },
      TASK_STATUS: {
        queued: 'В очереди', running: 'В работе', review: 'На ревью',
        repair: 'На исправлении', done: 'Готов', failed: 'Упал'
      },
      REQUIREMENT_STATUS: {
        open: 'Открыто', 'in-spec': 'В спецификации', placeholder: 'Заглушка',
        deferred: 'Отложено', dropped: 'Снято'
      },
      GATE_STATUS: {
        pending: 'Ожидает', passed: 'Пройден', failed: 'Провален'
      },
      MODE: {
        full: 'Полный', semi: 'Полуавтомат', interview: 'Интервью', manual: 'Ручной'
      },
      DEPTH: { strict: 'Строгая', normal: 'Обычная', deep: 'Глубокая' },
      POLISH: { 'true': 'Включена', 'false': 'Выключена' },
      /**
       * The register's two values.
       *
       * Named REGISTER rather than EXPLAIN, which would have matched MODE/DEPTH/
       * POLISH: `EXPLAIN`, `EXPLAIN_ORDER` and `explain()` below are the
       * i-popover machinery, and two of those three are read by name from
       * scripts/validate/dashboard-integrity.ts and dashboard-logic.test.ts.
       */
      REGISTER: { plain: 'Простые', normal: 'Обычные' },
      STRATEGY_DECISION: {
        change_strategy: 'Сменить подход', stop_incomplete: 'Остановить',
        request_limit: 'Запросить попытки'
      },
      READINESS_RESULT: {
        passed: 'Пройдена', setup_failed: 'Ошибка настройки',
        unavailable: 'Недоступна', not_applicable: 'Не нужна'
      },
      ONE_WAY_KIND: {
        deleted: 'Удаления', renamed: 'Переименования', migration: 'Миграции',
        'dependency-major': 'Крупные обновления зависимостей'
      },
      CHECK_RESULT: {
        not_run: 'Не запускалась', passed: 'Пройдена', failed: 'Не прошла',
        unavailable: 'Недоступна', stale: 'Устарела'
      },
      FAILURE_CAUSE: {
        product: 'Ошибка в продукте', test: 'Ошибка в тесте',
        setup: 'Ошибка настройки', unavailable_capability: 'Нечем проверить'
      },
      DEFECT_CAUSE: {
        product: 'Продукт', test: 'Тест', contract: 'Контракт',
        evidence: 'Доказательства', environment: 'Окружение'
      },
      DEFECT_STATUS: { open: 'Открыт', verified: 'Подтверждён', superseded: 'Заменён' },
      REQUIREMENT_RESULT: {
        passed: 'Прошло проверку', failed: 'Не прошло проверку', incomplete: 'Не проверено до конца'
      },
      /** The words on screen that are the value of no field. */
      SCREEN: {
        dials: 'Тумблеры прогона',
        progress: 'Прогресс проекта',
        coverage: 'Покрытие брифа',
        stage: 'Этап сейчас',
        elapsed: 'Прошло времени',
        estimate: 'Осталось',
        tasks: 'Таски',
        debt: 'Долг',
        assumptions: 'Допущения',
        variables: 'Переменные',
        tests: 'Тесты',
        requirements: 'Требования',
        stages: 'Этапы',
        build: 'Ход разработки',
        'requirement-list': 'Требования',
        wave: 'Волна',
        criticalPath: 'Критический путь',
        calendar: 'Календарных',
        register: 'Объяснения',
        offContract: 'Вне контракта',
        gates: 'Гейты',
        defects: 'Дефекты',
        repairBudget: 'Попытки исправления',
        strategy: 'Решение по стратегии',
        readiness: 'Готовность к проверке',
        handover: 'Ваш ход',
        placeholders: 'Заглушки',
        promised: 'Обещано доделать',
        oneWay: 'Необратимые изменения',
        stopReason: 'Причина остановки',
        holder: 'Метка прогона',
        quote: 'Вашими словами',
        checked: 'Как проверено',
        openFindings: 'Открытые замечания',
        tasksFor: 'Таски требования',
        untraced: 'Не покрыто тасками',
        context: 'Услышано, но не взято',
        additions: 'Сверх запрошенного',
        files: 'Файлы',
        zone: 'Зона таска',
        commits: 'Сохранено в истории',
        handoffs: 'Передачи свежему субагенту',
        repairs: 'Заходы в ремонт',

   * and filing it under a guessed kind would be the page writing the state.
   * Promised work exists only from contract 4, where the record carries it.
   */
  function handoverOf(state) {
    var debt = (state && state.debt) || {};
    var lines = function (list) { return Array.isArray(list) ? list.map(lineOf) : []; };
    var record = state && state.contractVersion >= 4 ? state.verification : null;
    var promised = record && Array.isArray(record.promisedWork)
      ? record.promisedWork
        .filter(function (item) { return item && item.status === 'open'; })
        .map(function (item) { return lineOf(item.description); })
      : [];
    var oneWay = {};
    var unknownOneWay = [];
    lines(state && state.oneWay).forEach(function (line) {
      var cut = line.indexOf(' — ');
      var kind = cut === -1 ? '' : line.slice(0, cut).trim();
      if (ONE_WAY_ORDER.indexOf(kind) === -1) { unknownOneWay.push(line); return; }
      (oneWay[kind] = oneWay[kind] || []).push(line.slice(cut + 3));
    });
    var out = {
      emptyEnv: lines(debt.emptyEnv),
      placeholders: lines(debt.placeholders),
      promised: promised,
      oneWay: oneWay,
      unknownOneWay: unknownOneWay,
      assumptions: lines(debt.assumptions)
    };
    var oneWayCount = unknownOneWay.length;
    ONE_WAY_ORDER.forEach(function (kind) { oneWayCount += (oneWay[kind] || []).length; });
    out.oneWayCount = oneWayCount;
    out.total = out.emptyEnv.length + out.placeholders.length + out.promised.length
      + oneWayCount + out.assumptions.length;
    return out;
  }

  /** How many lines of one group are shown before the rest is folded. */
  var FOLD_AFTER = 5;

  /**
   * What the state holds for one таск, and nothing it does not.
   *
   * A field the state does not carry is left out rather than reported as zero:
   * «Перезапуски: 0» would be a claim, and an absent field makes none. A state
   * from before contract 3 carried one `commit`; it is read as a list of one.
   */
  function taskDetailOf(state, id) {
    var tasks = (state && state.tasks) || [];
    var task = null;
    tasks.forEach(function (item) { if (item && item.id === id) task = item; });
    if (!task) return null;
    var out = { id: task.id, onCriticalPath: criticalChain(tasks).indexOf(task.id) !== -1 };
    var list = function (value) { return Array.isArray(value) ? value.map(lineOf) : null; };
    var files = list(task.files);
    if (files && files.length) out.files = files;
    var zone = list(task.zone);
    if (zone && zone.length) out.zone = zone;
    var commits = list(task.commits) || (typeof task.commit === 'string' ? [task.commit] : null);
    if (commits && commits.length) out.commits = commits.map(function (hash) { return hash.slice(0, 7); });
    var serves = list(task.requirementIds);
    if (serves && serves.length) out.requirementIds = serves;
    var waits = list(task.blockedBy);
    if (waits && waits.length) out.blockedBy = waits;
    ['retries', 'repairs', 'handoffs'].forEach(function (key) {
      if (typeof task[key] === 'number' && isFinite(task[key])) out[key] = task[key];
    });
    if (task.tests && typeof task.tests.passed === 'number' && typeof task.tests.failed === 'number') {
      out.tests = { passed: task.tests.passed, failed: task.tests.failed };
    }
    var closure = null;
    try { closure = closureOf(state); } catch (error) { closure = null; }
    if (closure && closure.defects[task.id]) out.defects = closure.defects[task.id];
    return out;
  }

  /**
   * One требование's chain: the user's words, the таски that name it, and —
   * from contract 4 — how it was checked.
   *
   * The check results are the ones `verificationOf` derives the требование's
   * own result from, stale when a fingerprint moved, so the chain cannot say
   * «passed» beside a требование the page counts as failed. A record that does
   * not read leaves `unreadable` set and no partial chain: half a chain looks
   * like a whole one to a reader who cannot see the other half.
   */
  function requirementDetailOf(state, id) {
    var requirements = (state && state.requirements) || [];
    var entry = null;
    requirements.forEach(function (item) { if (item && item.id === id) entry = item; });
    if (!entry) return null;
    var out = {
      id: entry.id,
      status: entry.status,
      title: typeof entry.title === 'string' && entry.title.trim() !== '' ? entry.title : null,
      servingTaskIds: ((state && state.tasks) || [])
        .filter(function (task) { return task && Array.isArray(task.requirementIds) && task.requirementIds.indexOf(id) !== -1; })
        .map(function (task) { return task.id; }),
      quotes: [],
      result: null,
      checks: [],
      openFindings: [],
      defects: [],
      established: false,
      unreadable: false
    };
    var record = state && state.contractVersion >= 4 ? state.verification : null;
    if (!record) return out;
    try {
      var summary = verificationOf(state);
      if (summary.legacy) return out;
      var names = function (item) { return Array.isArray(item.requirementIds) && item.requirementIds.indexOf(id) !== -1; };
      var quotes = record.version >= 2 && Array.isArray(record.sourceClauses)
        ? record.sourceClauses
          .filter(function (clause) { return clause && clause.classification === 'requirement' && names(clause); })
          .map(function (clause) { return lineOf(clause.quote); })
        : [];
      var checkIds = [];
      record.obligations
        .filter(function (item) { return item.targetRevision === record.targetRevision && names(item); })
        .forEach(function (item) {
          item.checkIds.forEach(function (check) { if (checkIds.indexOf(check) === -1) checkIds.push(check); });
        });
      var checks = [];
      checkIds.forEach(function (checkId) {
        var check = record.checks.filter(function (item) { return item.id === checkId; })[0];
        if (!check) return;
        var execution = effectiveExecution(check, record);
        var line = { id: check.id, method: lineOf(check.method), result: summary.checkResults[check.id] || 'not_run' };
        if (execution && execution.failureCause) line.failureCause = execution.failureCause;
        if (execution && execution.limitation) line.limitation = lineOf(execution.limitation);
        checks.push(line);
      });
      var findings = record.findings.filter(function (item) { return item.status === 'open' && names(item); });
      var ownFindingIds = record.findings.filter(names).map(function (item) { return item.id; });
      var defects = record.version >= 3 && Array.isArray(record.defects)
        ? record.defects
          .filter(function (defect) {
            if (defect.status === 'superseded') return false;
            return [defect.rootFindingId].concat(defect.findingIds || [])
              .some(function (findingId) { return ownFindingIds.indexOf(findingId) !== -1; });
          })
          .map(function (defect) {
            return { id: defect.id, status: defect.status, causeClass: defect.causeClass,
              counterexample: lineOf(defect.counterexample) };
          })
        : [];
      out.quotes = quotes;
      out.result = summary.requirementResults[id] || null;
      out.checks = checks;
      out.openFindings = findings.map(function (item) { return lineOf(item.description); });
      out.defects = defects;
      out.established = true;
    } catch (error) {
      out.unreadable = true;
    }
    return out;
  }

  /**
   * The user's words the manifest phase classified as context, each with its
   * reason — what makes «nothing the user said quietly vanished» checkable.
   */
  function contextClausesOf(state) {
    var record = state && state.contractVersion >= 4 ? state.verification : null;
    if (!record || record.version < 2 || !Array.isArray(record.sourceClauses)) return [];
    return record.sourceClauses
      .filter(function (clause) { return clause && clause.classification === 'context'; })
      .map(function (clause) {
        return { quote: lineOf(clause.quote), reason: lineOf(clause.exclusionReason) };
      });
  }

  /** What the прогон delivered beyond the ask, one line each, as written. */
  function additionsOf(state) {
    return state && Array.isArray(state.additions) ? state.additions.map(lineOf) : [];
  }

  /**
   * Live требования no таск names, and the tone to mark them in.
   *
   * Nothing is untraced before the plan has cut a single таск: every
   * требование would be, and a screen of marks saying the plan has not happened
   * yet says nothing the stage card does not. After G3 has passed, the plan
   * check has already ruled on the trace, so the mark is a record, not an alarm.
   */
  function untracedOf(state) {
    var tasks = (state && state.tasks) || [];
    if (tasks.length === 0) return { ids: [], tone: 'quiet' };
    var named = {};
    tasks.forEach(function (task) {
      ((task && task.requirementIds) || []).forEach(function (id) { named[id] = true; });
    });
    var ids = ((state && state.requirements) || [])
      .filter(function (item) { return item && item.status !== 'deferred' && item.status !== 'dropped' && !named[item.id]; })
      .map(function (item) { return item.id; });
    var plan = null;
    ((state && state.gates) || []).forEach(function (gate) { if (gate && gate.id === 'G3') plan = gate; });
    return { ids: ids, tone: plan && plan.status === 'passed' ? 'quiet' : 'fail' };
  }

  /**
   * The set of opened rows with one key flipped, as a new object.
   *
   * The regions are rebuilt on every poll, so an opened detail is remembered by
   * key — таск id, требование id, group name — rather than by the node that
   * held it, the way an opened findings list is remembered by gate id.
   */
  function toggled(open, key) {
    var next = {};
    Object.keys(open || {}).forEach(function (name) { if (open[name]) next[name] = true; });
    if (next[key]) delete next[key]; else next[key] = true;
    return next;
  }

  /**
   * The lines an opened таск row shows, in the прогон's language.
   *
   * Composed here rather than in the view so a test can read them: the view is
   * the half of this page nothing in the repository executes.
   */
  function describeTask(state, id, language) {
    var detail = taskDetailOf(state, id);
    if (!detail) return [];
    var said = words(language);
    var name = said.SCREEN;
    var lines = [];
    if (detail.onCriticalPath) lines.push(name.onCriticalPath);
    if (detail.requirementIds) lines.push(said.UI.detail(name.serves, detail.requirementIds.join(', ')));
    if (detail.blockedBy) lines.push(said.UI.detail(name.waitsFor, detail.blockedBy.join(', ')));
    if (detail.files) lines.push(said.UI.detail(name.files, detail.files.join(', ')));
    if (detail.zone) lines.push(said.UI.detail(name.zone, detail.zone.join(', ')));
    if (detail.commits) lines.push(said.UI.detail(name.commits, detail.commits.join(', ')));
    if (detail.retries !== undefined) lines.push(said.UI.detail(name.retries, detail.retries));
    if (detail.repairs !== undefined) lines.push(said.UI.detail(name.repairs, detail.repairs));
    if (detail.handoffs !== undefined) lines.push(said.UI.detail(name.handoffs, detail.handoffs));
    if (detail.tests) lines.push(said.UI.detail(name.tests, said.UI.taskTests(detail.tests)));
    if (detail.defects) lines.push(said.UI.taskDefects(detail.defects));
    return lines;
  }

  /**
   * The lines an opened требование row shows: the user's words, its таски,
   * then — only where verification is established — its checks, open findings
   * and defects. An unreadable record says so in the run notice's own words and
   * shows no partial chain.
   */
  function describeRequirement(state, id, language) {
    var detail = requirementDetailOf(state, id);
    if (!detail) return [];
    var said = words(language);
    var name = said.SCREEN;
    var lines = [];
    detail.quotes.forEach(function (quote) {
      lines.push(said.UI.detail(name.quote, said.UI.quote(quote)));
    });
    lines.push(detail.servingTaskIds.length > 0
      ? said.UI.detail(name.tasksFor, detail.servingTaskIds.join(', '))
      : said.UI.noTasksFor);
    if (detail.unreadable) { lines.push(said.UI.recordUnreadable); return lines; }
    if (!detail.established) { lines.push(said.UI.notEstablished); return lines; }
    if (detail.checks.length === 0) {
      lines.push(said.UI.noChecks);
    } else {
      lines.push(name.checked + ':');
      detail.checks.forEach(function (check) {
        lines.push(said.UI.checkLine(check, label(said.CHECK_RESULT, check.result),
          check.failureCause ? label(said.FAILURE_CAUSE, check.failureCause) : null));
      });
    }
    if (detail.openFindings.length > 0) {
      lines.push(name.openFindings + ':');
      detail.openFindings.forEach(function (finding) { lines.push(finding); });
    }
    detail.defects.forEach(function (defect) {
      lines.push(said.UI.defectLine(defect, label(said.DEFECT_STATUS, defect.status),
        label(said.DEFECT_CAUSE, defect.causeClass)));
    });
    return lines;
  }

  /** Coarse on purpose, and never rounded up to a minute it has not reached. */
  function formatGap(ms, language) {
    return words(language).UI.gap(ms);
  }

  /**
   * The longest interval this прогон has already spent without a write.
   *
   * The threshold for "too quiet" is not a number chosen here. A прогон writes
   * at transitions and nowhere else, so how long it goes quiet is a property of
   * the work it is doing: a манифест can take ten minutes and say nothing,
   * while a build writes at every таск. The run's own longest completed pause
   * is the only evidence there is about its rhythm, and it is what the notice
   * measures against. Fewer than two marks is not evidence, and returns null.
   */
  function longestSilence(marks) {
    if (!marks || marks.length < 2) return null;
    var longest = 0;
    for (var i = 1; i < marks.length; i += 1) {
      var gap = marks[i] - marks[i - 1];
      if (gap > longest) longest = gap;
    }
    return longest;
  }

  /** When the state was last written, for a прогон of either contract. */
  function lastWrite(state, marks) {
    if (state && typeof state.updatedAt === 'string') {
      var at = Date.parse(state.updatedAt);
      if (!isNaN(at)) return at;
    }
    // Contract 1 carried no `updatedAt`. The newest instant the state records
    // is the closest thing to it that such a прогон has.
    return (marks && marks.length > 0) ? marks[marks.length - 1] : null;
  }

  /**
   * How long the state has been silent, and whether that is unusual for it.
   *
   * Null when the прогон is stopped: a finished or interrupted run is silent
   * lawfully, and `runNotice` already says which. Otherwise this is the one
   * place `updatedAt` becomes visible to a reader. The contract names the
   * dashboard as that field's reader, and until now the page spent it only on
   * arithmetic nobody could see — so a session that died mid-стадия left the
   * clocks running and said nothing.
   */
  function silenceNotice(state, now, marks, register, language) {
    if (!state || isStopped(state)) return null;
    var last = lastWrite(state, marks);
    if (last === null) return null;

    var say = words(language).UI;
    var plain = (register || registerOf(state)) === 'plain';
    // A прогон stopped on a question is silent on purpose, and however long it
    // waits it is not stalled: the reader, not the run, owes the next move.
    var waiting = awaitingOf(state);
    if (waiting) return { alarming: false, awaiting: true, line: say.awaitingNotice(formatMoment(waiting.since)) };
    var quiet = Math.max(0, now - last);
    var record = longestSilence(marks);
    if (record !== null && quiet > record) {
      // The claim is named here and only here: the reader is about to go to
      // the chat, and a second chat that found the прогон claimed names the
      // same token. The calm notice has nothing wrong to explain.
      var holder = holderOf(state);
      var line = say.silenceAlarming(say.gap(quiet), say.gap(record), plain);
      if (holder) line += ' ' + say.holderLine(holder.token, formatMoment(holder.since));
      return { alarming: true, line: line };
    }
    return { alarming: false, line: say.silenceCalm(say.gap(quiet), plain) };
  }

  /**
   * What each region of the screen is, and what it is saying about this прогон.
   *
   * The second half is the point. A fixed sentence explaining that «Осталось»
   * holds an estimate is read once and never again; the numbers it was built
   * from — which median, how long a chain — are what a reader stops to ask
   * about. Every entry recomputes them through the same functions the region
   * renders with, so an explanation cannot drift from the figure above it.
   *
   * Each returns paragraphs: the first says what the region is, the rest say
   * what it holds now. The empty state is explained too — that is exactly when
   * a reader is least able to guess.
   */
  L10N.ru.EXPLAIN = {
    dials: function (state) {
      var changes = (state.dialChanges || []).length;
      return [
        'Три тумблера, на которых идёт прогон: режим, глубина и доводка.',
        'Режим «' + label(L10N.ru.MODE, state.mode) + '», глубина «' + label(L10N.ru.DEPTH, state.depth)
          + '», доводка ' + label(L10N.ru.POLISH, state.polish).toLowerCase() + '.',
        changes > 0
          ? 'По ходу прогона тумблеры меняли: записано изменений ' + changes + '. Смена записывается вместе с фазой, на которой произошла.'
          : 'Тумблеры не меняли с начала прогона.',
        'Режим решает, сколько спрашивают у пользователя; глубина — насколько глубоко под бриф копать; доводка — идёт ли круг доводки после приёмки. Ни один тумблер не убирает гейт.'
      ];
    },

    progress: function (state) {
      var p = overallProgress(state);
      return [
        'Весь прогон одной цифрой: этапы, а внутри разработки — таски.',
        p.stagesTotal === 0
          ? 'Этапы ещё не заведены, поэтому считать нечего.'
          : 'Пройдено этапов ' + p.stagesDone + ' из ' + p.stagesTotal + ', таски прошли '
            + Math.round(p.tasksShare * 100) + '% пути (принято ' + p.tasksDone + ' из '
            + p.tasksTotal + ') — вместе ' + p.percent + '%.',
        'Этапы весят не поровну, и начатый этап никогда не считается нулём. Разработка растёт не по принятым таскам, а по пройденному пути: на ревью — 0,8 таска, в ремонте и в работе — 0,5, в очереди — ноль. Это та же шкала, по которой «Осталось» считает остаток, только с другого конца, поэтому две цифры на экране не спорят.'
          + (p.tasksOffContract > 0
            ? ' Тасков вне контракта ' + p.tasksOffContract + ': они в счёте, но пути не прошли.'
            : '')
      ];
    },

    coverage: function (state) {
      var share = coverage(state.requirements);
      var counts = countRequirements(state.requirements);
      return [
        'Какая доля живых требований манифеста дошла до спеки.',
        share.live === 0
          ? 'Требования ещё не записаны — манифест пишется в первой фазе, до неё круг пуст.'
          : share.inSpec + ' из ' + share.live + ' живых требований в спеке, это ' + share.percent + '%.',
        'Снятых требований ' + counts.dropped + ', и в знаменатель они не входят: снятое требование — не пробел в покрытии, его больше нет.'
      ];
    },

    stage: function (state) {
      var stage = currentStage(state);
      var place = stagePosition(state);
      return [
        'Этап, на котором прогон стоит сейчас, и его место в дороге из восьми.',
        stage
          ? 'Идёт «' + label(L10N.ru.STAGE_LABEL, stage.id) + '», ' + place.position + '-й из ' + place.total
            + ', состояние — ' + label(L10N.ru.STAGE_STATUS, stage.status).toLowerCase() + '.'
          : 'Текущий этап ещё не записан в состояние.',
        'Часы идут от начала этапа и встают, когда он закрыт. Этап открывается той же записью, которой закрылся предыдущий, поэтому между ними не остаётся времени, не принадлежащего никакому этапу.'
      ];
    },

    elapsed: function (state, now, marks) {
      var median = medianTaskMs(state, now, marks);
      return [
        'Рабочее время с начала прогона — не календарное.',
        median === null
          ? 'Медиана на таск появится, когда закончатся два таска: один — это анекдот, а не медиана.'
          : 'Медиана на таск — ' + formatMinutes(median) + '.',
        'Пауза между двумя отметками засчитывается не целиком, а не длиннее ' + formatMinutes(IDLE_CEILING_MS)
          + ': прогон, брошенный на ночь, не должен отчитаться за ночь работы.'
      ];
    },

    estimate: function (state, now, marks) {
      var what = 'Сколько ещё осталось — вилкой, а не одним числом.';
      if (state.finishedAt) return [what, 'Прогон завершён, оценивать больше нечего.'];

      var estimate = estimateMs(state, now, marks);
      var chain = criticalPath(state.tasks);
      var median = medianTaskMs(state, now, marks);
      return [
        what,
        estimate === null
          ? 'Пока не из чего считать: нужна медиана, а она появляется после двух готовых тасков.'
          : formatMinutes(estimate.low) + ' … ' + formatMinutes(estimate.high) + ' при медиане '
            + formatMinutes(median) + ' и цепочке в ' + chain + ' '
            + plural(chain, 'таск', 'таска', 'тасков') + '.',
        'Считается по критическому пути — самой длинной цепочке зависимостей, а не по сумме оставшихся тасков: то, что идёт параллельно, времени не добавляет.'
      ];
    },

    tasks: function (state) {
      var counts = countTasks(state.tasks);
      var travelled = taskShare(state.tasks);
      return [
        'Сколько тасков закончено из нарезанных.',
        counts.total === 0
          ? 'Таски ещё не нарезаны — это делает фаза плана.'
          : 'Готово ' + counts.done + ' из ' + counts.total + ', в работе ' + counts.active
            + ': пишется ' + counts.running + ', на ревью ' + counts.review
            + ', в ремонте ' + counts.repair
            + (counts.offContract > 0 ? ', вне контракта ' + counts.offContract : '') + '.',
        'Цифра сверху — принятые таски, и полоска шире неё: второй отрезок — работа в полёте, ревью за 0,8 таска, ремонт и работа за 0,5. Пройдено ' + Math.round(travelled.share * 100) + '% пути. Полоска умеет и отступать: таск, отправленный с ревью в ремонт, теряет часть пути, потому что работа вернулась.'
          + (counts.retries > 0
            ? ' Повторов ' + counts.retries + '. Таск, вернувшийся не готовым, идёт в ремонт, а не переписывается на месте.'
            : '')
      ];
    },

    debt: function (state) {
      var debt = debtCounts(state);
      return [
        'Долг прогона: то, что сделано не до конца и о чём это записано честно.',
        debt.total === 0
          ? 'Долга нет.'
          : 'Всего ' + debt.total + ': заглушек ' + debt.placeholders + ', допущений '
            + debt.assumptions + ', пустых переменных ' + debt.emptyEnv + '.',
        'В пустых переменных лежат только имена. Значение секрета не попадает в состояние никогда — это правило безопасности, а не договорённость.'
      ];
    },

    tests: function (state) {
      var tests = testsOf(state);

<!--
  The snapshot: the run state as it stood when the page was last synchronised.

  It exists because the page can be opened with no address at all — inlined into
  an in-app pane, double-clicked, or read a month after the прогон — and a
  document whose origin is null cannot reach the file beside it by any route:
  not a relative src, not an absolute file://, not a request from script. The
  snapshot is what makes the page show; state.js beside it is what makes the
  clocks move.

  It is written from state.js and never by hand, so it is equal to that file or
  older than it — never newer, and never in disagreement with it.

  In this repository it stays null. A template carrying a real прогон would
  copy that run into every project the skill is installed into, and
  scripts/validate/dashboard-integrity.ts fails the bundle when this block holds
  anything else.
-->
<script id="snapshot">
/* maestro:snapshot:start */
globalThis.MAESTRO_SNAPSHOT = null;
/* maestro:snapshot:end */
</script>

<script id="validation-snapshot">
/* maestro:validation:start */
globalThis.MAESTRO_VALIDATION_SNAPSHOT = null;
/* maestro:validation:end */
</script>

<script id="view">
(function () {

  var VALIDATION_FILE = 'validation.js';
  var POLL_MS = 2000;

  var openFindings = {};
  /**
   * Which таск rows, требование rows and folded groups the reader has opened,
   * keyed `task:<id>`, `req:<id>` and `group:<name>`, kept across the redraw
   * for the reason `openFindings` is.
   */

  var TICK_MS = 1000;
  var LANGUAGE_KEY = 'maestro.language';

   * The language this page is painting in, resolved in two steps.
   *
   * `state.language` is what the прогон decided, and it is what a page paints
   * on first sight. A reader's own choice, kept in this browser, overrides it —
   * that choice is about the person looking at the screen and not about the
   * run, so it belongs to the browser and reaches the прогон never.
   *
   * Absent both, `ru`: that is what a state written before the dial existed
   * means, and the only reading that invents no choice.
   */
  var lang = 'ru';
  var T = L.words(lang);

  function storedLanguage() {
    return kept(LANGUAGE_KEY, L.LANGUAGE_ORDER);
  }

  function useLanguage(next) {
    lang = next;
    T = L.words(next);
    document.documentElement.lang = next;
    paintLabels();
  }

  /**
   * The theme, in three states, and CSS is the source of truth for all three.
   *
   * An explicit choice is an attribute on the root and a line in this browser's
   * own storage. No choice is no attribute at all, and then the media query in
   * the stylesheet governs — which is why nothing here reads a colour or
   * decides one. This function sets an attribute and reflects a button; the
   * page decides how that looks.
   *
   * It is in the browser and nowhere else on purpose. A theme is a property of
   * the reader's eyes and their screen, and two people watching one прогон may
   * legitimately want different ones — so it reaches `state.js`, the run state
   * and the state contract never.
   */
  var THEME_KEY = 'maestro.theme';
  var THEMES = ['light', 'dark'];

    try {

    } catch (ignored) {

      // A page that cannot remember a preference still has to render.

    }

        useTheme(theme);
        return;

        // composed in the language that has just changed.

    // Without this the page would repaint itself and go on claiming the old one.

    for (var j = 0; j < buttons.length; j += 1) {

  var lastGood = null;
  var pollTimer = null;
  var refillOpenExplainer = function () {};
  // renderStages draws its rows long after mountExplainers has run, and it
  // draws them again on every poll, so the row's button cannot hold a closure
  // over the controller — it asks for it by name at click time instead.
  var toggleExplainer = function () {};
  var marks = [];

  function el(id) { return document.getElementById(id); }

  /**
   * Re-inject state.js rather than request it.
   *
   * The page opens from file://, where a sibling request is blocked by the
   * origin rules — which is why the writer emits a JS assignment instead of
   * JSON. The query string is not decoration: without it the browser serves the
   * first copy for the rest of the прогон, and the page freezes while still
   * looking live.
   */
  function poll() {
    generation += 1;
    globalThis.MAESTRO_STATE = undefined;
    globalThis.MAESTRO_VALIDATION = undefined;

    validation.src = VALIDATION_FILE + '?v=' + generation;

      script.src = STATE_FILE + '?v=' + generation;
      script.addEventListener('load', settle);
      script.addEventListener('error', settle);

    if (!envelope || envelope.status !== 'invalid') return;
    var details = (envelope.violations || []).slice(0, 3).map(function (item) {
      return item.field + ': ' + item.message;
    }).join('; ');
    var revision = envelope.candidateRevision || '?';
    var message = lang === 'en'
      ? 'Candidate ' + revision + ' was rejected. ' + details
      : 'Кандидат ' + revision + ' отклонён. ' + details;

    el('regions').hidden = true;
  }

  function apply(state) {

    // load, so a file that stops parsing is reported rather than read as an
    // unchanging прогон.
    var outcome = L.readOutcome(lastGood, state);

    if (outcome === 'blank') {
      problem(T.UI.cannotRead(STATE_FILE));
      return;
    }

    if (outcome === 'stale') {
      // Saying the state cannot be read would be false: one was read, and it
      // is on the screen. What changed is that it stopped moving, and that is
      // the part worth naming.
      problem(T.UI.snapshotOnly(STATE_FILE));
      return;
    }

    lastGood = state;
    marks = L.collectMarks(state);
    clearProblem();
    render(state);
    if (state.contractVersion < 4 && state.finishedAt && pollTimer !== null) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function problem(message) {
    var box = el('problem');
    box.textContent = message;
    box.hidden = false;
    // With nothing ever read, an empty page would say less than the message.

  function clearProblem() {

    el('regions').hidden = false;

   */
  function put(parent, tag, text, className) {

    // notice: the outcome says the run stopped, only the reason says whether
    // the reader has a move.

    put(dials, 'span', T.UI.polishChip(L.label(T.POLISH, state.polish)), 'chip');
    // Named, never bare: the depth reads «Обычная» and this reads «Обычные»,
    // and two bare chips a word apart would be read as one setting stated
    // twice. Drawn only when the state carries the field — a прогон written
    // before the register existed renders exactly as it did, and absent is not
    // a choice the page may report as `normal`.
    if (state.explain) {
      put(dials, 'span', T.UI.registerChip(L.label(T.REGISTER, state.explain)), 'chip');
    }

    renderProgress(state);
    renderCards(state);
    renderStages(state);
    renderBuild(state);
    renderRequirements(state);
    renderGates(state);
    renderHandover(state);
    refillOpenExplainer();
    tick();
  }

  function renderProgress(state) {
    var progress = L.overallProgress(state);
    text('progress-percent', progress.percent + '%');
    el('progress-fill').style.width = progress.percent + '%';

    text('progress-sub', T.UI.progressSub(progress));
  }

  function renderCards(state) {
    var now = Date.now();

    // --- покрытие брифа -------------------------------------------------
    var cover = L.coverage(state.requirements);
    var circumference = 2 * Math.PI * 34;
    el('coverage-arc').setAttribute('stroke-dashoffset',
      String(circumference * (1 - cover.percent / 100)));
    text('coverage-percent', cover.percent);
    text('coverage-sub', T.UI.coverageSub(cover));

    // --- этап сейчас ----------------------------------------------------
    var stage = L.currentStage(state);
    var place = L.stagePosition(state);
    text('stage-name', stage ? L.label(T.STAGE_LABEL, stage.id) : '—');
    text('stage-position', T.UI.stagePosition(place));
    var stageClock = el('stage-clock');
    stageClock.dataset.from = (stage && stage.startedAt) || '';
    stageClock.dataset.until = (stage && stage.finishedAt) || '';

    // --- прошло времени -------------------------------------------------
    var runClock = el('run-clock');
    runClock.dataset.from = state.startedAt || '';
    runClock.dataset.until = '';
    var median = L.medianTaskMs(state, now, marks);
    text('run-median', T.UI.medianSub(median));

    // --- осталось -------------------------------------------------------
    var estimate = L.estimateMs(state, now, marks);
    var chain = L.criticalPath(state.tasks);
    if (state.finishedAt) {
      text('estimate', '—');
      text('estimate-sub', T.UI.estimateFinished);
    } else if (estimate === null) {
      text('estimate', T.UI.estimateEarly);
      text('estimate-sub', T.UI.estimateEarlySub);
    } else {
      text('estimate', T.UI.estimateRange(estimate.low, estimate.high));
      text('estimate-sub', T.UI.criticalPathSub(chain));
    }

    // --- таски ----------------------------------------------------------
    var tasks = L.countTasks(state.tasks);
    var travelled = L.taskShare(state.tasks);
    // The big figure stays the count of *accepted* таски, which is what the
    // vocabulary says this card names. The bar is where the work in flight is
    // shown, in a second segment, so the two can no longer contradict.
    text('tasks-done', tasks.total > 0 ? tasks.done : '—');
    text('tasks-total', tasks.total > 0 ? ' / ' + tasks.total : '');
    var settled = tasks.total > 0 ? tasks.done / tasks.total : 0;
    var share = Math.round(travelled.share * 100);
    el('tasks-fill').style.width = Math.round(settled * 100) + '%';
    el('tasks-flight').style.width = Math.max(0, share - Math.round(settled * 100)) + '%';
    text('tasks-sub', T.UI.tasksSub(tasks, share));
    var closure = null;
    try { closure = L.closureOf(state); } catch (error) { closure = null; }
    text('tasks-budget', closure ? T.UI.repairBudget(closure.budget) : '');

    // --- долг -----------------------------------------------------------
    var debt = L.debtCounts(state);
    text('debt-count', debt.total);
    text('debt-sub', T.UI.debtSub(debt));

    // --- тесты ----------------------------------------------------------
    var tests = L.testsOf(state);
    text('tests-count', tests ? tests.passed : '—');
    text('tests-sub', T.UI.testsSub(tests));

    // --- требования -----------------------------------------------------
    var counts = L.countRequirements(state.requirements);
    text('req-count', counts.total);
    text('req-sub', L.label(T.REQUIREMENT_STATUS, 'dropped') + ' ' + counts.dropped
      + ' · ' + L.label(T.REQUIREMENT_STATUS, 'deferred') + ' ' + counts.deferred
      + ' · ' + L.label(T.REQUIREMENT_STATUS, 'placeholder') + ' ' + counts.placeholder);
  }

  function renderStages(state) {
    var host = clear(el('stages'));

    L.orderedStages(state).forEach(function (stage) {
      var row = put(host, 'div', null, 'row stage stage-' + stage.status);
      var name = put(row, 'span', L.label(T.STAGE_LABEL, stage.id), 'name');
      // Inside `.name`, so the row's four columns are untouched by it.
      (function (key) {
        var info = put(name, 'button', 'i', 'info');
        info.type = 'button';
        info.setAttribute('data-explains', key);
        info.setAttribute('aria-label', T.UI.stageAria(L.label(T.STAGE_LABEL, stage.id)));
        info.addEventListener('click', function (event) {
          event.stopPropagation();
          toggleExplainer(key, info);
        });
      }('stage:' + stage.id));
      put(row, 'span', L.label(T.STAGE_STATUS, stage.status), 'status');
      var clock = put(row, 'span', '', 'clock');
      if (stage.startedAt) {
        clock.dataset.from = stage.startedAt;
        clock.dataset.until = stage.finishedAt || '';
      }

      // The note is why a stage was skipped, and how far a running one has got.
      if (stage.note) put(host, 'p', stage.note, 'note');

      // A failed stage is never drawn as still running, and never without the
      // reason: the findings are the whole point of showing the failure.
      if (stage.status === 'failed') {
        var gate = L.gateFor(state, stage.id);
        var findings = (gate && gate.findings) || [];
        if (findings.length === 0) {
          put(host, 'p', T.UI.noFindings, 'findings findings-fail');
        } else {
          var list = put(host, 'ul', null, 'findings findings-fail');
          findings.forEach(function (finding) { put(list, 'li', L.lineOf(finding)); });
        }
      }
    });
  }

  function renderBuild(state) {
    var host = clear(el('tasks'));
    var closure = null;
    try { closure = L.closureOf(state); } catch (error) { closure = null; }
    var chips = clear(el('build-chips'));
    var tasks = state.tasks || [];

    if (tasks.length === 0) {
      empty(host, T.UI.noTasks);
      return;
    }

    var counts = L.countTasks(tasks);
    chip(chips, L.label(T.TASK_STATUS, 'done'), counts.done, 'done');
    chip(chips, L.label(T.TASK_STATUS, 'running'), counts.running, 'running');
    if (counts.review > 0) chip(chips, L.label(T.TASK_STATUS, 'review'), counts.review, 'review');
    if (counts.repair > 0) chip(chips, L.label(T.TASK_STATUS, 'repair'), counts.repair, 'repair');
    chip(chips, L.label(T.TASK_STATUS, 'queued'), counts.queued);
    if (counts.failed > 0) chip(chips, L.label(T.TASK_STATUS, 'failed'), counts.failed, 'failed');
    // Said out loud rather than dropped: without this chip the chips sum to
    // less than the total, and the page is losing a таск in front of the reader.
    if (counts.offContract > 0) chip(chips, T.SCREEN.offContract, counts.offContract);

    var critical = L.criticalChain(tasks);

    L.groupByWave(tasks).forEach(function (group) {
      // The claim of parallelism is read from the clocks, never from the size
      // of the wave: a wave is what may run together, not what did.
      var parallel = L.peakParallel(group.tasks, state, Date.now());
      put(host, 'div', T.UI.waveName(group.wave, parallel), 'wave-name');

      group.tasks.forEach(function (task) {
        var onPath = critical.indexOf(task.id) !== -1;
        var row = put(host, 'div', null, 'task task-' + task.status + (onPath ? ' critical' : ''));
        if (onPath) row.title = T.SCREEN.onCriticalPath;
        opener(row, 'task:' + task.id, T.UI.taskAria(task.id), function () { renderBuild(state); tick(); });
        put(row, 'span', task.id, 'id');

        var track = put(row, 'div', null, 'track');
        var fill = put(track, 'div', null, 'fill ' + task.status);
        if (STATUS_COLOR[task.status]) fill.style.background = STATUS_COLOR[task.status];
        put(fill, 'span', task.title, 'nm');

        // Colour says the таск is not ordinary work; the word says which kind.
        if (task.status === 'review' || task.status === 'repair' || task.status === 'failed') {
          put(fill, 'span', L.label(T.TASK_STATUS, task.status), 'phase');
          if (closure && closure.defects[task.id]) put(fill, 'span', T.UI.taskDefects(closure.defects[task.id]), 'phase defects');
        } else if (L.TASK_ORDER.indexOf(task.status) === -1) {
          // A status the contract does not define is printed as it was written,
          // through the same reader that keeps a finding from becoming
          // `[object Object]`. The row keeps its neutral colour: the page does
          // not invent a status, it reports the one it was handed.
          put(fill, 'span', L.lineOf(task.status), 'phase');
        }

        var clock = put(row, 'span', '—', 'mins');
        if (task.startedAt) {
          clock.dataset.from = task.startedAt;
          clock.dataset.until = task.finishedAt || '';
        }

        if (openRows['task:' + task.id]) {
          var detail = put(host, 'ul', null, 'detail');
          L.describeTask(state, task.id, lang).forEach(function (line) { put(detail, 'li', line); });
        }
      });
    });
  }

  /**
   * Make a drawn row open and close its detail, by mouse and by keyboard.
   *
   * The row stays a `div` because it holds a block track; a `button` may not.
   * The open state lives in `openRows` under `key`, so the detail survives the
   * redraw every poll performs.
   */
  function opener(row, key, aria, redraw) {
    var open = !!openRows[key];
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-expanded', open ? 'true' : 'false');
    row.setAttribute('aria-label', aria);
    row.classList.add('opens');
    var flip = function () {
      openRows = L.toggled(openRows, key);
      redraw();
    };
    row.addEventListener('click', flip);
    row.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      flip();
    });
  }

  /**
   * A heading and its lines, the lines past FOLD_AFTER folded behind a press.
   * Nothing is drawn for an empty list: an empty group is not news.
   */
  function drawGroup(host, key, heading, lines, redraw, nested) {
    if (lines.length === 0) return;
    put(host, nested ? 'h4' : 'h3', T.UI.groupToggle(heading, lines.length), 'group-name');
    var open = !!openRows['group:' + key];
    var list = put(host, 'ul', null, 'group');
    (open ? lines : lines.slice(0, L.FOLD_AFTER)).forEach(function (line) { put(list, 'li', line); });
    if (lines.length <= L.FOLD_AFTER) return;
    var toggle = put(host, 'button',
      open ? T.UI.foldLess : T.UI.foldMore(lines.length - L.FOLD_AFTER), 'findings-toggle');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.addEventListener('click', function () {
      openRows = L.toggled(openRows, 'group:' + key);
      redraw();
    });
  }

  /**
   * A whole list behind one press, for a record nobody has to act on — the
   * words heard but not taken, and what was delivered beyond the ask.
   */
  function drawFolded(host, key, heading, lines, redraw) {
    if (lines.length === 0) return;
    var open = !!openRows['group:' + key];
    var toggle = put(host, 'button', T.UI.groupToggle(heading, lines.length), 'findings-toggle');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.addEventListener('click', function () {
      openRows = L.toggled(openRows, 'group:' + key);
      redraw();
    });
    if (!open) return;
    var list = put(host, 'ul', null, 'findings findings-quiet');
    lines.forEach(function (line) { put(list, 'li', line); });
  }

  function renderHandover(state) {
    var host = clear(el('handover'));
    var handover = L.handoverOf(state);
    if (handover.total === 0) {
      empty(host, T.UI.handoverEmpty);
      return;
    }
    var again = function () { renderHandover(state); };
    // Names only: S2 keeps every value out of the state, and this list is
    // where a value would be most tempting to show.
    drawGroup(host, 'emptyEnv', T.SCREEN.variables, handover.emptyEnv, again);
    drawGroup(host, 'placeholders', T.SCREEN.placeholders, handover.placeholders, again);
    drawGroup(host, 'promised', T.SCREEN.promised, handover.promised, again);
    if (handover.oneWayCount > 0) {
      put(host, 'h3', T.UI.groupToggle(T.SCREEN.oneWay, handover.oneWayCount), 'group-name');
      L.ONE_WAY_ORDER.forEach(function (kind) {
        drawGroup(host, 'oneWay:' + kind, L.label(T.ONE_WAY_KIND, kind), handover.oneWay[kind] || [], again, true);
      });
      drawGroup(host, 'oneWay:unknown', T.UI.oneWayUnknown, handover.unknownOneWay, again, true);
    }
    drawGroup(host, 'assumptions', T.SCREEN.assumptions, handover.assumptions, again);
  }

  function renderRequirements(state) {
    var host = clear(el('requirements'));
    var counts = L.countRequirements(state.requirements);
    if (counts.total === 0) {
      empty(host, T.UI.noRequirements);
    }

    L.REQUIREMENT_ORDER.forEach(function (status) {
      var row = put(host, 'div', null, 'row coverage coverage-' + status);
      put(row, 'span', L.label(T.REQUIREMENT_STATUS, status), 'name');
      put(row, 'span', counts[status], 'count');
    });
    put(host, 'p', T.UI.requirementsTotal(counts.total), 'total');
    try { T.UI.scopeRows(L.scopeProgressOf(state)).forEach(function (line) { put(host, 'p', line, 'total'); }); }
    catch (error) { put(host, 'p', L.runNotice(state, lang), 'total'); }
    if (state.contractVersion >= 4) {
      try { put(host, 'p', T.UI.verificationRows(L.verificationOf(state)), 'total'); }
      catch (error) { put(host, 'p', L.runNotice(state, lang), 'total'); }
    }
    var closure = null;
    try { closure = L.closureOf(state); } catch (error) { closure = null; }
    if (closure) put(host, 'p', T.UI.readinessRow(closure.readiness), 'total');
    renderRequirementRows(state);
  }

  /**
   * One row per требование, opening to its chain, then the two folded records
   * below the list. Redrawn on its own when a row opens, so the counts above
   * and the explainer beside the heading are left where they are.
   */
  function renderRequirementRows(state) {
    var rows = clear(el('requirement-rows'));
    var folds = clear(el('requirement-folds'));
    var again = function () { renderRequirementRows(state); };
    var untraced = L.untracedOf(state);

    (state.requirements || []).forEach(function (requirement) {
      if (!requirement || !requirement.id) return;
      var detail = L.requirementDetailOf(state, requirement.id);
      var row = put(rows, 'div', null, 'row req req-' + L.lineOf(requirement.status));
      opener(row, 'req:' + requirement.id, T.UI.requirementAria(requirement.id), again);
      put(row, 'span', requirement.id, 'id');
      var words = put(row, 'span', null, 'name');
      // The user's own words lead; the прогон's English title follows them, or
      // stands alone for a state written before the words were recorded.
      if (detail && detail.quotes.length > 0) put(words, 'span', T.UI.quote(detail.quotes[0]), 'quote');
      if (detail && detail.title) {
        put(words, 'span', detail.title, detail.quotes.length > 0 ? 'title' : 'quote');
      }
      if (untraced.ids.indexOf(requirement.id) !== -1) {
        put(words, 'span', T.SCREEN.untraced, 'untraced untraced-' + untraced.tone);
      }
      put(row, 'span', L.label(T.REQUIREMENT_STATUS, requirement.status), 'status');
      put(row, 'span', detail && detail.result ? L.label(T.REQUIREMENT_RESULT, detail.result) : '', 'status');

      if (openRows['req:' + requirement.id]) {
        var list = put(rows, 'ul', null, 'detail');
        L.describeRequirement(state, requirement.id, lang).forEach(function (line) { put(list, 'li', line); });
      }
    });

    drawFolded(folds, 'context', T.SCREEN.context,
      L.contextClausesOf(state).map(function (item) { return T.UI.contextLine(item); }), again);
    drawFolded(folds, 'additions', T.SCREEN.additions, L.additionsOf(state), again);
  }

  function renderGates(state) {
    var host = clear(el('gates'));
    var gates = state.gates || [];
    if (gates.length === 0) {
      empty(host, T.UI.noGates);
      return;
    }

    var register = L.registerOf(state);

    gates.forEach(function (storedGate) {
      var gate = storedGate;
      if (state.contractVersion >= 4 && storedGate.id === 'G4') {
        try { gate = Object.assign({}, storedGate, { status: L.verificationOf(state).g4 }); }
        catch (error) { gate = Object.assign({}, storedGate, { status: 'pending' }); }
      }
      var row = put(host, 'div', null, 'row gate gate-' + gate.status);
      put(row, 'span', gate.id, 'id');
      put(row, 'span', L.label(T.STAGE_LABEL, L.GATE_AFTER[gate.id]) || '', 'name');
      put(row, 'span', L.label(T.GATE_STATUS, gate.status), 'status');

      var view = L.findingsView(gate);
      if (!view.show) return;

      var findings = gate.findings || [];
      var drawList = function () {
        var list = put(host, 'ul', null, 'findings findings-' + view.tone);
        findings.forEach(function (finding) { put(list, 'li', L.lineOf(finding)); });
      };

      if (!view.folded) { drawList(); return; }

      // The region is cleared and rebuilt every poll, so an opened list is
      // remembered by gate id rather than by the node that held it. Re-folding
      // on the redraw was the other option and it is the wrong one: the list
      // would snap shut every two seconds, which is less time than it takes to
      // read one finding.
      var toggle = put(host, 'button', L.findingsLine(view.count, register, lang), 'findings-toggle');
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded', openFindings[gate.id] ? 'true' : 'false');
      toggle.addEventListener('click', function () {
        openFindings[gate.id] = !openFindings[gate.id];
        renderGates(state);
      });
      if (openFindings[gate.id]) drawList();
    });
  }

  /**
   * Clocks redraw every second; the state is only re-read on the poll.
   *
   * Every clock on the page is a `[data-from]` element, so one loop moves the
   * run, the stage and each таск. They show working time — a прогон left for a
   * day does not report a day of work — and the calendar span is printed beside
   * the run clock whenever the two have parted company.
   */
  function tick() {
    if (!lastGood) return;
    var now = Date.now();

    var nodes = document.querySelectorAll('[data-from]');
    for (var i = 0; i < nodes.length; i += 1) {
      var node = nodes[i];
      var from = node.dataset.from;
      if (!from) { node.textContent = '—'; continue; }
      var until = node.dataset.until || undefined;
      node.textContent = L.formatDuration(L.worked(from, lastGood, now, until, marks));
    }

    var span = L.elapsed(lastGood.startedAt, lastGood, now);
    var active = L.worked(lastGood.startedAt, lastGood, now, undefined, marks);
    var calendar = el('run-calendar');
    // Printed only when a pause actually happened: an identical second number
    // teaches the reader to ignore the line it will one day need.
    if (span !== null && active !== null && span - active > 60000) {
      calendar.textContent = T.UI.calendar(L.formatDuration(span));
      calendar.hidden = false;
    } else {
      calendar.hidden = true;
    }
  }

  /**
   * The i beside each region, and the single popover all thirteen fill.
   *
   * One node rather than thirteen. Moving it is what closes the previous
   * explanation, so "at most one open" needs no state to keep it true, and the
   * cards never shift: a reader stays looking at the number while reading about
   * it. Filling it through `put` keeps the textContent rule by construction,
   * and that matters here — the texts quote таск titles, which are the user's
   * own words.
   */
  function mountExplainers() {
    var box = el('explain');
    var open = null;

    function close() {
      open = null;
      box.hidden = true;
    }

    // One key space for two kinds of thing: a region is named by its own key,
    // a стадия by `stage:<id>`. That is what lets close, refill and reopen stay
    // one code path rather than three that have to agree.
    function linesFor(key) {
      var now = Date.now();
      var register = L.registerOf(lastGood);
      return key.indexOf('stage:') === 0
        ? L.explainStage(key.slice(6), lastGood, now, marks, register, lang)
        : L.explain(key, lastGood, now, marks, register, lang);
    }

    function fill(key) {
      clear(box);
      linesFor(key).forEach(function (line, index) {
        put(box, 'p', line, index === 0 ? 'what' : null);
      });
    }

    function toggle(key, button) {
      if (open === key) return close();
      open = key;
      fill(key);
      place(button);
    }

    function place(button) {
      box.hidden = false;
      box.style.left = '0px';
      var rect = button.getBoundingClientRect();
      var left = rect.left + window.scrollX;
      // Kept inside the viewport: against the right-hand edge the popover would
      // open past it and need sideways scrolling to read.
      var edge = window.scrollX + document.documentElement.clientWidth - 8;
      var overflow = (left + box.offsetWidth) - edge;
      if (overflow > 0) left = Math.max(8, left - overflow);
      box.style.top = (rect.bottom + window.scrollY + 6) + 'px';
      box.style.left = left + 'px';
    }

    var regions = document.querySelectorAll('[data-region]');
    for (var i = 0; i < regions.length; i += 1) {
      (function (region) {
        var key = region.getAttribute('data-region');
        // Most regions are titled by an h2 and the i belongs beside it. The
        // dials are not titled at all — they are the header's own row of chips
        // — so the region names itself and carries the button directly.
        var heading = region.querySelector('h2');
        if (!heading && !region.getAttribute('data-region-label')) return;
        var button = put(heading || region, 'button', 'i', 'info');
        button.type = 'button';
        // Named at paint time rather than here: the heading is empty until a
        // language is in force, and the name has to follow a reader who
        // switches languages with the popover already mounted.
        button.setAttribute('data-aria-region', key);
        button.setAttribute('data-explains', key);
        button.addEventListener('click', function (event) {
          event.stopPropagation();
          toggle(key, button);
        });
      }(regions[i]));
    }

    document.addEventListener('click', function (event) {
      if (open && !box.contains(event.target)) close();
    });
    document.addEventListener('keydown', function (event) {
      if (open && event.key === 'Escape') close();
    });

    // An explanation is about the прогон, so it follows it: a popover left open
    // while the state moves is refilled rather than left describing a moment
    // that has passed.
    //
    // A стадия's button is a different node after every poll, so the popover
    // cannot hold on to the one it was opened from. It re-finds the button by
    // key and re-places itself over it — and closes when the row is gone, which
    // is the honest thing to do with an explanation of something no longer on
    // the screen. A region's heading is drawn once and needs neither.
    refillOpenExplainer = function () {
      if (!open) return;
      fill(open);
      if (open.indexOf('stage:') !== 0) return;
      var button = document.querySelector('[data-explains="' + open + '"]');
      if (!button) return close();
      place(button);
    };

    toggleExplainer = toggle;
  }

  mountExplainers();
  mountSwitches();

  // The theme before anything else, so a reader who chose one never sees the
  // other flash past. Absent a choice, no attribute is set and the stylesheet's
  // media query decides — which is the state the page ships in.
  useTheme(kept(THEME_KEY, THEMES));

  // A language before the first state: the headings are empty in the markup, so
  // a page whose state never loads would otherwise show a column of blank
  // titles above its error message.
  useLanguage(storedLanguage() || 'ru');

  // The snapshot first, so a page opened without an address shows the прогон
  // instead of an error; then the file, which is what makes it move.
  if (L.isStateShape(globalThis.MAESTRO_SNAPSHOT)) apply(globalThis.MAESTRO_SNAPSHOT);
  applyValidation();

  poll();
  pollTimer = setInterval(poll, POLL_MS);
  setInterval(tick, TICK_MS);
})();
</script>

</body>
</html>
