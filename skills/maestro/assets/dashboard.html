<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro</title>
<!--
  The human view of a прогон. Specification: docs/spec/dashboard.md.

  One file, no build step, no network. Every style and every script is inline
  because the page is copied into a target project and opened from file://,
  where a sibling load is blocked and an absent CDN is indistinguishable from
  a broken page. Its only input is state.js.

  Every number here is derived, never stored. A duration written into the state
  goes stale silently; one computed at render time cannot.
-->
<style>
  /*
    Three states, and CSS is the source of truth for all three.

    Before anyone has pressed anything there is no `data-theme` attribute at
    all, and the media query governs — that is what makes the page follow the
    screen it was opened on. A press writes the attribute, and from then on the
    attribute wins in both directions. JavaScript sets the attribute and reads
    nothing back: a theme decided in script would be a second place to look the
    day these colours are changed.

    Narrow-first. The page usually lives in a pane beside the chat, 380 to 900
    pixels wide, so the dense values are the base rules and one block at the
    end, @media (min-width: 62rem), restores the roomy ones. Nothing is hidden
    or reordered at any width. The band's own split at 48rem is a different
    fact and stays beside #band. docs/spec/dashboard.md › A Narrow Pane lists
    both breakpoints, and npm run dashboard holds the page to that list.
  */
  :root,
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fbfbfa;
    --panel: #ffffff;
    --line: #e3e2df;
    --ghost: #ececea;
    --ink: #1b1a17;
    --muted: #6d6a63;
    --accent: #2f6f4f;
    --info: #2c5a8a;
    --fix: #6b3f8a;
    --warn: #8a5a12;
    --fail: #9b2c2c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --bg: #17181a;
      --panel: #1f2124;
      --line: #33363b;
      --ghost: #2a2d31;
      --ink: #e8e6e1;
      --muted: #9a978f;
      --accent: #6cc38f;
      --info: #7aa9d8;
      --fix: #b28ad0;
      --warn: #d8a657;
      --fail: #e07a72;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181a;
    --panel: #1f2124;
    --line: #33363b;
    --ghost: #2a2d31;
    --ink: #e8e6e1;
    --muted: #9a978f;
    --accent: #6cc38f;
    --info: #7aa9d8;
    --fix: #b28ad0;
    --warn: #d8a657;
    --fail: #e07a72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: .75rem;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 1.1rem; margin: 0 0 .5rem; }
  h2 {
    font-size: .72rem; margin: 0 0 .6rem; color: var(--muted);
    font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  }
  header { margin-bottom: 1rem; }
  main { display: grid; gap: .75rem; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: .75rem;
  }
  #dials { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px;
    padding: .1rem .6rem; font-size: .78rem; color: var(--muted);
    white-space: nowrap;
  }
  .chip-done { color: var(--accent); border-color: var(--accent); }
  .chip-running { color: var(--warn); border-color: var(--warn); }
  .chip-review { color: var(--info); border-color: var(--info); }
  .chip-repair { color: var(--fix); border-color: var(--fix); }
  .chip-failed { color: var(--fail); border-color: var(--fail); }
  #notice {
    margin: .75rem 0 0;
    white-space: pre-line;
    padding: .6rem .8rem;
    border-left: 3px solid var(--warn);
    background: var(--panel);
    color: var(--warn);
  }
  #notice.alarm {
    border-left-color: var(--fail);
    color: var(--fail);
  }
  /* --- the i beside a region, and the one popover they all fill --- */
  .info {
    margin-left: .45rem; padding: 0; width: 1.15em; height: 1.15em;
    border: 1px solid var(--line); border-radius: 50%;
    background: none; color: var(--muted);
    font: inherit; font-size: .72rem; line-height: 1;
    cursor: pointer; vertical-align: middle;
  }
  .info:hover, .info:focus-visible { color: var(--ink); border-color: var(--muted); }
  /* A row's i is quieter than a heading's: eight of them in a column would
     otherwise read as eight warnings. */
  .row .info { margin-left: .4rem; font-size: .62rem; border-color: transparent; }
  .row:hover .info, .row .info:focus-visible { border-color: var(--line); }
  #explain {
    position: absolute; z-index: 10; max-width: 24rem;
    padding: .7rem .85rem;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink);
    font-size: .82rem; line-height: 1.5;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .22);
  }
  #explain p { margin: 0 0 .5rem; }
  #explain p:last-child { margin-bottom: 0; }
  #explain .what { color: var(--muted); }
  #problem {
    padding: 1rem;
    border: 1px solid var(--fail);
    border-radius: 8px;
    color: var(--fail);
    background: var(--panel);
  }

  /* --- the band: what is happening, at the top --- */
  #band {
    display: grid; gap: 1rem 1.5rem; margin: .75rem 0 0;
    grid-template-columns: minmax(0, 1fr);
    border-left: 4px solid var(--line);
  }
  @media (min-width: 48rem) {
    #band { grid-template-columns: minmax(0, 1fr) minmax(10rem, 15rem); }
  }
  /* The colour is the stylesheet's decision: the script sets a class and reads
     nothing back. It is never the only signal — the word beside it says the
     same thing, and the background stays the panel's, so the four tokens keep
     the contrast they already have in both themes. */
  #band.band-working { border-left-color: var(--info); }
  #band.band-waiting { border-left-color: var(--warn); }
  #band.band-finished { border-left-color: var(--accent); }
  #band.band-failed { border-left-color: var(--fail); }
  .band-working #band-condition { color: var(--info); }
  .band-waiting #band-condition { color: var(--warn); }
  .band-finished #band-condition { color: var(--accent); }
  .band-failed #band-condition { color: var(--fail); }
  .band-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem 1rem; }
  .band-head h2 { margin: 0; }
  #band-condition { font-size: 1.15rem; font-weight: 700; }
  /* A closed run's own sentence, in the band's colour: a finished line under
     «Сбой» would contradict the word above it. One weight under the word. */
  #band-result { margin: .2rem 0 0; font-size: 1rem; font-weight: 600; overflow-wrap: anywhere; }
  .band-finished #band-result { color: var(--accent); }
  .band-failed #band-result { color: var(--fail); }
  /* A long dir must wrap, never scroll the pane at 380 pixels. */
  #band-report { margin: .15rem 0 0; overflow-wrap: anywhere; }
  #band-report code { overflow-wrap: anywhere; }
  #band-caption { margin-top: .5rem; font-variant-numeric: tabular-nums; }
  #band-headline { margin: .1rem 0 0; font-size: 1rem; }
  #band-flight { margin-top: .15rem; overflow-wrap: anywhere; }
  /* A range is two numbers and a gap; at the card headline size it wraps mid-phrase. */
  .band-side .value { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* Narrower than 62rem, as many 6rem cells as fit: the longest label,
     «Спецификация», fits one whole, where four fixed columns at a pane's 380
     pixels broke every label mid-word. Eight in a row from 62rem. Never a
     sideways scroll; overflow-wrap stays as the last resort below the pane. */
  .strip {
    list-style: none; margin: .75rem 0 0; padding: 0;
    display: grid; gap: .35rem; grid-template-columns: repeat(auto-fill, minmax(6rem, 1fr));
  }
  .strip li {
    min-width: 0; padding: .25rem .45rem; font-size: .72rem;
    border: 1px solid var(--line); border-radius: 6px;
  }
  .strip .name { display: block; overflow-wrap: anywhere; }
  .strip .clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  .strip .cell-skipped { border-style: dashed; color: var(--muted); }
  .strip .cell-failed { border-color: var(--fail); }
  .strip .cell-failed .name, .strip .cell-failed .clock { color: var(--fail); }
  .strip [aria-current] { border-color: var(--ink); font-weight: 700; }
  .bar { display: flex; background: var(--ghost); border-radius: 999px; height: .5rem; overflow: hidden; margin: .5rem 0 .4rem; }
  /* The rounded ends belong to the track, which clips them, so a bar of two
     segments meets in a flat seam instead of two facing bulges. */
  .bar > i { display: block; height: 100%; background: var(--ink); }
  .sub { color: var(--muted); font-size: .85rem; margin: 0; }

  /* --- the four cards --- */
  #cards {
    display: grid; gap: .75rem; padding: 0; border: 0; background: none;
    grid-template-columns: repeat(2, 1fr);
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: .7rem .8rem; min-height: 6rem;
  }
  .card .value { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .value small { font-size: .95rem; font-weight: 400; color: var(--muted); }
  #tests-failed.fail { color: var(--fail); }
  /* One square per таск, in the chip palette. The colour is never the only
     carrier of the status: each square names it, and the line under the
     squares counts the same statuses in words. */
  .squares { display: flex; flex-wrap: wrap; gap: .2rem; list-style: none; padding: 0; margin: .5rem 0 .4rem; }
  .sq { width: .7rem; height: .7rem; border-radius: 2px; box-sizing: border-box; background: var(--ghost); }
  .sq-done { background: var(--accent); }
  .sq-running { background: var(--warn); }
  .sq-review { background: var(--info); }
  .sq-repair { background: var(--fix); }
  .sq-failed { background: var(--fail); }
  .sq-queued { background: none; border: 1px solid var(--ghost); }
  .sq-off-contract { background: none; border: 1px dashed var(--muted); }
  .coverage-line { margin-top: .2rem; }

  /* --- rows shared by stages, requirements and gates --- */
  .row {
    display: grid;
    grid-template-columns: minmax(7rem, auto) 1fr auto auto;
    gap: .75rem;
    align-items: baseline;
    padding: .3rem 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row .status, .row .clock, .row .count { color: var(--muted); font-size: .9rem; }
  .row .clock, .row .count { font-variant-numeric: tabular-nums; }
  .stage-active .name, .task-running .name { color: var(--accent); font-weight: 600; }
  .stage-failed .name, .stage-failed .status,
  .gate-failed .name, .gate-failed .status { color: var(--fail); }
  .stage-skipped .name, .stage-skipped .status { color: var(--muted); }
  .gate-passed .status { color: var(--accent); }
  .note { color: var(--muted); font-size: .85rem; margin: -.1rem 0 .3rem 0; }
  /* Geometry only. The tone is the render's decision and it is always stated:
     a list that fell through to the quiet colour would be a failure drawn as
     settled, which is the defect this pair replaced, inverted. */
  .findings { margin: .25rem 0 .75rem 1rem; font-size: .9rem; }
  .findings-fail { color: var(--fail); }
  .findings-quiet { color: var(--muted); }
  .findings-toggle {
    display: block; margin: .25rem 0 .6rem 1rem; padding: 0;
    background: none; border: 0; font: inherit; font-size: .9rem;
    color: var(--muted); text-align: left; cursor: pointer;
  }
  .findings-toggle:hover, .findings-toggle:focus-visible { color: var(--ink); }
  .empty, .total { color: var(--muted); margin: .25rem 0 0; }

  /* --- the build, grouped by wave --- */
  .wave-name {
    font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: .9rem 0 .35rem;
  }
  .wave-name:first-child { margin-top: 0; }
  .task {
    display: grid; grid-template-columns: 2.2rem 1fr 3.5rem;
    gap: .6rem; align-items: center; padding: .12rem 0;
  }
  .task .id { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
  .task .mins { text-align: right; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .track { background: var(--ghost); border-radius: 4px; overflow: hidden; }
  .track > .fill {
    display: flex; justify-content: space-between; gap: .5rem;
    padding: .18rem .5rem; border-radius: 4px; color: #fff;
  }
  .track > .fill.queued { background: none; color: var(--muted); border: 1px dashed var(--line); }
  .track > .fill .phase { opacity: .85; font-size: .8rem; }
  /* Why the bar is the colour it is, under the bar and in its column. The words
     carry the meaning; the tone only repeats the bar's. */
  .task .why {
    grid-column: 2; margin-top: -.3rem; font-size: .8rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task .why.sent-back { color: var(--fix); }
  .task .why.repair-outcome { color: var(--fail); }
  #build-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; }
  /* A row that opens says so on hover and on focus, and nowhere louder. */
  .opens { cursor: pointer; border-radius: 4px; }
  .opens:hover { background: var(--ghost); }
  /* The track is --ghost too, so focus cannot be a background alone. */
  .opens:focus-visible { background: var(--ghost); outline: 2px solid var(--info); outline-offset: 1px; }
  /* The critical path is a mark at the row's edge, in the tone the page uses
     for work in flight: it says where the time goes, not that anything failed. */
  .task.critical .id { color: var(--warn); font-weight: 600; }
  .task.critical .id::before { content: "◆ "; font-size: .7em; }
  .detail {
    margin: .2rem 0 .6rem 2.8rem; padding: 0; list-style: none;
    font-size: .85rem; color: var(--muted);
  }
  .detail li { padding: .05rem 0; overflow-wrap: anywhere; }
  .row .name .quote { color: var(--ink); }
  .row .name .title { display: block; color: var(--muted); font-size: .85rem; }
  .untraced { margin-left: .5rem; font-size: .8rem; }
  .untraced-fail { color: var(--fail); }
  .untraced-quiet { color: var(--muted); }
  /* The requirement filter: the look of the view switches, wrapping, because
     five chips with their counts do not fit one line on a phone. Scoped to
     .chips, so the status chips keep their own look. */
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; margin: .5rem 0 .4rem; }
  .chips .chip {
    font: inherit; font-size: .78rem; line-height: 1;
    padding: .3rem .55rem; border: 1px solid var(--line); border-radius: 6px;
    background: none; color: var(--muted); cursor: pointer;
  }
  .chips .chip[aria-pressed="true"] { background: var(--ghost); color: var(--ink); }
  .row .name .reason { display: block; color: var(--muted); font-size: .85rem; }

  /* --- what only the user can settle --- */
  .group-name {
    font-size: .8rem; font-weight: 600; margin: .8rem 0 .25rem; color: var(--ink);
  }
  h4.group-name { font-weight: 400; color: var(--muted); margin: .4rem 0 .15rem 1rem; }
  #handover .group-name:first-child { margin-top: 0; }
  .group { margin: 0 0 .3rem 1rem; padding-left: 1rem; font-size: .9rem; }
  .group li { overflow-wrap: anywhere; }

  /* --- what just happened: the sentence, and its age at the far edge --- */
  .feed { margin: 0; padding: 0; list-style: none; font-size: .9rem; }
  .feed li { display: flex; justify-content: space-between; gap: .75rem; padding: .1rem 0; }
  .feed .line { min-width: 0; overflow-wrap: anywhere; }
  .feed .age { flex: none; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  /* The two view controls: the reader's own, and nothing to do with the прогон. */
  #controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
    margin: .6rem 0 0;
  }
  .switch {
    display: inline-flex; border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden; background: var(--panel);
  }
  .switch button {
    font: inherit; font-size: .78rem; line-height: 1;
    padding: .3rem .55rem; border: 0; background: none; color: var(--muted);
    cursor: pointer;
  }
  .switch button[aria-pressed="true"] { background: var(--ghost); color: var(--ink); }
  [hidden] { display: none !important; }

  /* --- 62rem and wider: the roomy page ---
     Two by two cards on anything narrower; one row of four here. */
  @media (min-width: 62rem) {
    body { padding: 1.5rem; }
    h1 { font-size: 1.25rem; }
    main, #cards { gap: 1rem; }
    section { padding: 1rem; }
    #band-condition { font-size: 1.35rem; }
    .band-side .value { font-size: 1.25rem; }
    .strip { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    .strip li { font-size: .78rem; }
    #cards { grid-template-columns: repeat(4, 1fr); }
    .card { padding: .9rem 1rem; min-height: 7.5rem; }
    .card .value { font-size: 1.7rem; }
  }
</style>
</head>
<body>

<header>
  <h1 id="run-title">Maestro</h1>
  <div id="dials" data-region="dials" data-region-label="dials"></div>
  <div id="controls">
    <div class="switch" id="theme-switch">
      <button type="button" data-theme-choice="light"></button>
      <button type="button" data-theme-choice="dark"></button>
    </div>
    <div class="switch" id="language-switch">
      <button type="button" data-language-choice="ru">RU</button>
      <button type="button" data-language-choice="en">EN</button>
    </div>
  </div>
  <!-- A container, not a region: it holds two sibling regions, because
       mountExplainers hangs a region's i on the first h2 inside it, and an
       outer region would take the inner one's heading. -->
  <section id="band" class="band" hidden>
    <div class="band-main" data-region="header">
      <div class="band-head">
        <h2 data-label="header"></h2>
        <b id="band-condition">—</b>
      </div>
      <p id="band-result" hidden></p>
      <p class="sub" id="band-report" hidden></p>
      <p class="sub" id="band-caption"></p>
      <div class="bar"><i id="progress-fill" style="width:0%"></i></div>
      <p id="band-headline"></p>
      <p class="sub" id="band-flight" hidden></p>
      <ol class="strip" id="strip"></ol>
    </div>
    <div class="band-side" data-region="estimate">
      <h2 data-label="estimate"></h2>
      <div class="value" id="estimate">—</div>
      <p class="sub" id="estimate-sub"></p>
    </div>
  </section>
  <p id="notice" hidden></p>
</header>

<p id="problem" hidden></p>

<main id="regions">

  <section id="cards">
    <div class="card" data-region="requirements">
      <h2 data-label="requirements"></h2>
      <div class="value"><span id="req-built">—</span><small id="req-live"></small></div>
      <div class="bar"><i id="req-fill" style="width:0%"></i></div>
      <p class="sub" id="req-sub"></p>
    </div>

    <div class="card" data-region="tasks">
      <h2 data-label="tasks"></h2>
      <div class="value"><span id="tasks-done">—</span><small id="tasks-total"></small></div>
      <ol class="squares" id="task-squares"></ol>
      <p class="sub" id="tasks-sub"></p>
      <p class="sub" id="tasks-budget"></p>
    </div>

    <div class="card" data-region="tests">
      <h2 data-label="tests"></h2>
      <div class="value"><span id="tests-count">—</span> <small id="tests-failed"></small></div>
      <p class="sub" id="tests-sub"></p>
    </div>

    <div class="card" data-region="elapsed">
      <h2 data-label="elapsed"></h2>
      <div class="value" id="run-clock">—</div>
      <p class="sub" id="run-median"></p>
      <p class="sub" id="run-calendar"></p>
    </div>
  </section>

  <section data-region="handover"><h2 data-label="handover"></h2><div id="handover"></div></section>

  <section data-region="feed"><h2 data-label="feed"></h2><div id="feed"></div></section>

  <section data-region="stages"><h2 data-label="stages"></h2><div id="stages"></div></section>

  <section data-region="build">
    <h2 data-label="build"></h2>
    <div id="build-chips"></div>
    <div id="tasks"></div>
  </section>

  <section data-region="requirement-list">
    <h2 data-label="requirement-list"></h2>
    <div id="requirements"></div>
    <div id="requirement-rows"></div>
    <div id="requirement-folds"></div>
  </section>
  <section data-region="gates"><h2 data-label="gates"></h2><div id="gates"></div></section>
</main>

<div id="explain" hidden></div>

<script id="logic">
// Pure logic, no DOM. Kept separable on purpose: scripts/validate/dashboard-logic.test.ts
// evaluates exactly this block in a node:vm context, which is the only way to
// test a browser page in a repository with no runtime dependencies.
globalThis.MAESTRO_LOGIC = (function () {
  'use strict';

  var KNOWN_CONTRACT_VERSION = 10;

  // The run directory grammar of contract 7, copied from
  // skills/maestro/tools/runtime/state/paths.mts because this page imports
  // nothing; scripts/validate/dashboard-integrity.ts fails the build when the
  // two copies differ. The page reads the start date out of it and nothing else.
  var RUN_DIR_PATTERN = /^(\d{4}-\d{2}-\d{2})-([a-z0-9]+(?:-[a-z0-9]+)*)(--wip)?$/;

  // Mirrors docs/spec/phases.md. scripts/validate/dashboard-integrity.ts fails
  // the build when this set or any label below drifts from vocabulary.md.
  var STAGE_ORDER = [
    'preflight', 'manifest', 'briefing', 'spec',
    'plan', 'build', 'review', 'acceptance'
  ];

  /**
   * Every word the page shows, nested by language and by nothing else.
   *
   * One root, two branches, the same key set under each. That shape is the
   * whole guarantee: scripts/validate/dashboard-integrity.ts walks
   * `Object.keys(L10N)` and holds each branch to its own column of
   * vocabulary.md, so a language cannot be forgotten by omission — there is no
   * name to forget, only a branch that is either complete or reported. A pair
   * of flat `STAGE_LABEL` / `STAGE_LABEL_EN` constants would have left the
   * checker knowing eight names and the ninth shipping unchecked.
   *

<!--
  The snapshot: the run state as it stood when the page was last synchronised.

  It exists because the page can be opened with no address at all — inlined into
  an in-app pane, double-clicked, or read a month after the прогон — and a
  document whose origin is null cannot reach the file beside it by any route:
  not a relative src, not an absolute file://, not a request from script. The
  snapshot is what makes the page show; state.js beside it is what makes the
  clocks move.

  It is written from state.js and never by hand, so it is equal to that file or
  older than it — never newer, and never in disagreement with it.

  In this repository it stays null. A template carrying a real прогон would
  copy that run into every project the skill is installed into, and
  scripts/validate/dashboard-integrity.ts fails the bundle when this block holds
  anything else.
-->

/* maestro:snapshot:start */
globalThis.MAESTRO_SNAPSHOT = null;
/* maestro:snapshot:end */
</script>

      var script = document.createElement('script');
      script.src = STATE_FILE + '?v=' + generation;
      script.addEventListener('load', settle);
      script.addEventListener('error', settle);
      document.head.appendChild(script);

      function settle() {
        if (script.parentNode) script.parentNode.removeChild(script);
        apply(globalThis.MAESTRO_STATE);
        applyValidation();
      }
    }
  }

  function applyValidation() {
    var envelope = globalThis.MAESTRO_VALIDATION || globalThis.MAESTRO_VALIDATION_SNAPSHOT;
    var view = L.rejectionView(envelope, lastGood);
    if (!view) return;
    var details = (envelope.violations || []).slice(0, 3).map(function (item) {
      return item.field + ': ' + item.message;
    }).join('; ');
    var revision = envelope.candidateRevision || '?';
    var message = lang === 'en'
      ? 'Candidate ' + revision + ' was rejected. ' + details
      : 'Кандидат ' + revision + ' отклонён. ' + details;
    problem(message);
    // The accepted прогон stays under the error: hiding it would turn one
    // refused write into a blank page until the next accepted one.
    showRegions(view.keepRegions);
    if (view.suppressSuccess) el('notice').hidden = true;
  }

  function apply(state) {
    // A stale MAESTRO_STATE cannot survive here: it is cleared before every
    // load, so a file that stops parsing is reported rather than read as an
    // unchanging прогон.
    var outcome = L.readOutcome(lastGood, state);

    if (outcome === 'blank') {
      problem(T.UI.cannotRead(STATE_FILE));
      return;
    }

    if (outcome === 'stale') {
      // Saying the state cannot be read would be false: one was read, and it
      // is on the screen. What changed is that it stopped moving, and that is
      // the part worth naming.
      problem(T.UI.snapshotOnly(STATE_FILE));
      return;
    }

    lastGood = state;
    marks = L.collectMarks(state);
    clearProblem();
    keepingFocus(function () { render(state); });
    if (state.contractVersion < 4 && state.finishedAt && pollTimer !== null) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function problem(message) {
    var box = el('problem');
    box.textContent = message;
    box.hidden = false;
    // With nothing ever read, an empty page would say less than the message.
    showRegions(lastGood !== null);
  }

  function clearProblem() {
    el('problem').hidden = true;
    showRegions(true);
  }

  /**
   * The band sits in the header, outside <main>, so it is shown and hidden
   * with the regions explicitly: a band of dashes over "cannot read" would
   * be a condition word for a прогон nobody has read.
   */
  function showRegions(shown) {
    el('regions').hidden = !shown;
    el('band').hidden = !shown;
  }

  /**
   * Every value reaches the page through textContent, never innerHTML. The
   * state carries the user's own words — requirement text, gate findings, таск
   * titles — and a view that interprets them as markup is a view that can be
   * made to render something nobody wrote.
   */
  function put(parent, tag, text, className) {
    var node = document.createElement(tag);
    if (text !== undefined && text !== null) node.textContent = String(text);
    if (className) node.className = className;
    parent.appendChild(node);
    return node;
  }

  /**
   * Give a node the view rebuilds a key the next redraw re-finds it by. Every
   * region is cleared and drawn again on each poll, so without one a keyboard
   * reader on a row or a toggle would be dropped to <body> every two seconds.
   */
  function focusKey(node, key) {
    node.setAttribute('data-focus', key);
    return node;
  }

  /** Redraw, then hand focus back to the node that held it, found by its key. */
  function keepingFocus(redraw) {
    var held = document.activeElement;
    var key = held && held.getAttribute ? held.getAttribute('data-focus') : null;
    redraw();
    if (!key || document.activeElement === held) return;
    var nodes = document.querySelectorAll('[data-focus]');
    for (var i = 0; i < nodes.length; i += 1) {
      if (nodes[i].getAttribute('data-focus') === key) {
        nodes[i].focus({ preventScroll: true });
        return;
      }
    }
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  function empty(parent, message) {
    put(parent, 'p', message, 'empty');
  }

  function text(id, value) { el(id).textContent = value; }

  function chip(parent, label, count, kind) {
    put(parent, 'span', label + ' ' + count, 'chip' + (kind ? ' chip-' + kind : ''));
  }

  var STATUS_COLOR = {
    done: 'var(--accent)', running: 'var(--warn)', review: 'var(--info)',
    repair: 'var(--fix)', failed: 'var(--fail)', queued: ''
  };

  function render(state) {
    useLanguage(storedLanguage() || L.languageOf(state));
    el('run-title').textContent = T.UI.title(state.slug, L.runDateOf(state));

    // The reason a stopped прогон gave sits on its own line under the closure
    // notice: the outcome says the run stopped, only the reason says whether
    // the reader has a move.
    var reason = L.stopReasonOf(state);
    var notices = [L.runNotice(state, lang), reason ? T.UI.stopReasonLine(reason) : null,
      L.contractNotice(state.contractVersion, lang)]
      .filter(function (line) { return !!line; });
    // Recomputed on every poll rather than on every tick: `apply` calls
    // `render` each time state.js is read, whether or not it changed, so the
    // silence advances on its own without a second timer.
    var register = L.registerOf(state);
    var silence = L.silenceNotice(state, Date.now(), marks, register, lang);
    if (silence) notices.push(silence.line);
    var notice = el('notice');
    notice.textContent = notices.join('\n');
    notice.hidden = notices.length === 0;
    notice.className = silence && silence.alarming ? 'alarm' : '';
    document.title = L.tabTitle(state, lang);

    var dials = clear(el('dials'));
    put(dials, 'span', L.label(T.MODE, state.mode), 'chip');
    put(dials, 'span', L.label(T.DEPTH, state.depth), 'chip');
    // Named, never bare: the depth reads «Обычная» and this reads «Обычные»,
    // and two bare chips a word apart would be read as one setting stated
    // twice. Drawn only when the state carries the field — a прогон written
    // before the register existed renders exactly as it did, and absent is not
    // a choice the page may report as `normal`.
    if (state.explain) {
      put(dials, 'span', T.UI.registerChip(L.label(T.REGISTER, state.explain)), 'chip');
    }

    renderBand(state);
    renderCards(state);
    renderStages(state);
    renderBuild(state);
    renderRequirements(state);
    renderGates(state);
    renderHandover(state);
    placeHandover(state);
    renderFeed(state);
    refillOpenExplainer();
    tick();
  }

  /**
   * The band: the condition, the road, the sentence, the таски in flight and
   * the strip. Every decision is made in the logic block by a function a test
   * calls; this only applies them. The percent is printed once, in the
   * caption — two renderings of one live number are a defect even while they
   * agree.
   */
  function renderBand(state) {
    var condition = L.conditionOf(state);
    el('band').className = 'band band-' + condition.condition;
    text('band-condition', L.label(T.CONDITION, condition.condition));

    // After closure: the run's own sentence, then where its отчёт is. The path
    // is named for the reader to open, never fetched — the page reads state.js
    // and nothing else. Both go through textContent: the sentence is the run's
    // text, and a view that read it as markup would render what nobody wrote.
    var result = L.resultOf(state);
    text('band-result', result || '');
    el('band-result').hidden = result === null;
    var reportPath = L.reportPathOf(state);
    var report = clear(el('band-report'));
    if (reportPath !== null) {
      report.appendChild(document.createTextNode(T.UI.reportLine()));
      put(report, 'code', reportPath);
    }
    report.hidden = reportPath === null;

    var progress = L.overallProgress(state);
    text('band-caption', T.UI.bandCaption(progress.percent));
    el('progress-fill').style.width = progress.percent + '%';
    text('band-headline', T.UI.headline(L.countTasks(state.tasks)));
    var flight = T.UI.inFlightLine(L.inFlightOf(state));
    text('band-flight', flight);
    el('band-flight').hidden = flight === '';

    // A skipped or failed стадия says so in words where its clock would be,
    // so a status is never carried by a border alone. The clocks themselves
    // are filled by tick(), the same as the timeline's.
    var strip = clear(el('strip'));
    L.stripOf(state).forEach(function (cell) {
      var item = put(strip, 'li', null, 'cell-' + cell.status);
      if (cell.current) item.setAttribute('aria-current', 'step');
      put(item, 'span', L.label(T.STAGE_LABEL, cell.id), 'name');
      var clock = put(item, 'span', null, 'clock');
      if (cell.status === 'skipped' || cell.status === 'failed') {
        clock.textContent = L.label(T.STAGE_STATUS, cell.status);
      } else if (cell.from) {
        clock.dataset.from = cell.from;
        clock.dataset.until = cell.until || '';
      } else {
        clock.textContent = '—';
      }
    });
  }

  function renderCards(state) {
    var now = Date.now();

    // --- требования -----------------------------------------------------
    // Built of live until the current G4 has passed, then verified of live:
    // never «done» on the strength of activity alone.
    var progress = L.requirementProgressOf(state);
    var reached = progress.verified === null ? progress.built : progress.verified;
    text('req-built', progress.live > 0 ? reached : '—');
    text('req-live', progress.live > 0 ? ' / ' + progress.live : '');
    el('req-fill').style.width = (progress.live > 0 ? Math.round(reached / progress.live * 100) : 0) + '%';
    text('req-sub', T.UI.requirementsSub(progress));

    // --- рабочее время --------------------------------------------------
    var runClock = el('run-clock');
    runClock.dataset.from = state.startedAt || '';
    runClock.dataset.until = '';
    var median = L.medianTaskMs(state, now, marks);
    text('run-median', T.UI.medianSub(median));

    // --- осталось, at the right of the band -----------------------------
    var estimate = L.estimateMs(state, now, marks);
    var chain = L.criticalPath(state.tasks);
    if (state.finishedAt) {
      text('estimate', '—');
      text('estimate-sub', T.UI.estimateFinished);
    } else if (estimate === null) {
      text('estimate', T.UI.estimateEarly);
      text('estimate-sub', T.UI.estimateEarlySub);
    } else if (estimate.high <= 0) {
      text('estimate', '—');
      text('estimate-sub', L.estimateCaption(estimate, chain, lang));
    } else {
      text('estimate', T.UI.estimateRange(estimate.low, estimate.high));
      text('estimate-sub', L.estimateCaption(estimate, chain, lang));
    }

    // --- таски ----------------------------------------------------------
    // The big figure stays the count of *accepted* таски, which is what the
    // vocabulary says this card names. The squares show every таск's status
    // at once, and the band's bar is the one share of the road.
    var tasks = L.countTasks(state.tasks);
    text('tasks-done', tasks.total > 0 ? tasks.done : '—');
    text('tasks-total', tasks.total > 0 ? ' / ' + tasks.total : '');
    var squares = clear(el('task-squares'));
    L.taskSquaresOf(state).forEach(function (square) {
      var said = square.id + ' — ' + (square.status === 'off-contract'
        ? T.SCREEN.offContract : L.label(T.TASK_STATUS, square.status));
      var item = put(squares, 'li', null, 'sq sq-' + square.status);
      item.title = said;
      item.setAttribute('aria-label', said);
    });
    var tasksLine = T.UI.tasksSub(tasks);
    text('tasks-sub', tasksLine);
    el('tasks-sub').hidden = tasksLine === '';
    var closure = null;
    try { closure = L.closureOf(state); } catch (error) { closure = null; }
    text('tasks-budget', closure ? T.UI.repairBudget(closure.budget) : '');

    // --- тесты ----------------------------------------------------------
    var tests = L.testsOf(state);
    text('tests-count', tests ? tests.passed : '—');
    var failed = el('tests-failed');
    failed.textContent = tests ? T.UI.testsFailed(tests.failed) : '';
    failed.className = tests && tests.failed > 0 ? 'fail' : '';
    text('tests-sub', T.UI.testsSub(tests));
  }

  function renderStages(state) {
    var host = clear(el('stages'));

    L.orderedStages(state).forEach(function (stage) {
      var row = put(host, 'div', null, 'row stage stage-' + stage.status);
      var name = put(row, 'span', L.label(T.STAGE_LABEL, stage.id), 'name');
      // Inside `.name`, so the row's four columns are untouched by it.
      (function (key) {
        var info = put(name, 'button', 'i', 'info');
        info.type = 'button';
        info.setAttribute('data-explains', key);
        focusKey(info, key);
        info.setAttribute('aria-label', T.UI.stageAria(L.label(T.STAGE_LABEL, stage.id)));
        info.addEventListener('click', function (event) {
          event.stopPropagation();
          toggleExplainer(key, info);
        });
      }('stage:' + stage.id));
      put(row, 'span', L.label(T.STAGE_STATUS, stage.status), 'status');
      var clock = put(row, 'span', '', 'clock');
      if (stage.startedAt) {
        clock.dataset.from = stage.startedAt;
        clock.dataset.until = stage.finishedAt || '';
      }

      // The note is why a stage was skipped, and how far a running one has got.
      if (stage.note) put(host, 'p', stage.note, 'note');

      // A failed stage is never drawn as still running, and never without the
      // reason: the findings are the whole point of showing the failure.
      if (stage.status === 'failed') {
        var gate = L.gateFor(state, stage.id);
        var findings = (gate && gate.findings) || [];
        if (findings.length === 0) {
          put(host, 'p', T.UI.noFindings, 'findings findings-fail');
        } else {
          var list = put(host, 'ul', null, 'findings findings-fail');
          findings.forEach(function (finding) { put(list, 'li', L.lineOf(finding)); });
        }
      }
    });
  }

  function renderBuild(state) {
    var host = clear(el('tasks'));
    var closure = null;
    try { closure = L.closureOf(state); } catch (error) { closure = null; }
    var chips = clear(el('build-chips'));
    var tasks = state.tasks || [];

    if (tasks.length === 0) {
      empty(host, T.UI.noTasks);
      return;
    }

    var counts = L.countTasks(tasks);
    chip(chips, L.label(T.TASK_STATUS, 'done'), counts.done, 'done');
    chip(chips, L.label(T.TASK_STATUS, 'running'), counts.running, 'running');
    if (counts.review > 0) chip(chips, L.label(T.TASK_STATUS, 'review'), counts.review, 'review');
    if (counts.repair > 0) chip(chips, L.label(T.TASK_STATUS, 'repair'), counts.repair, 'repair');
    chip(chips, L.label(T.TASK_STATUS, 'queued'), counts.queued);
    if (counts.failed > 0) chip(chips, L.label(T.TASK_STATUS, 'failed'), counts.failed, 'failed');
    // Said out loud rather than dropped: without this chip the chips sum to
    // less than the total, and the page is losing a таск in front of the reader.
    if (counts.offContract > 0) chip(chips, T.SCREEN.offContract, counts.offContract);

    var critical = L.criticalChain(tasks);

    L.groupByWave(tasks).forEach(function (group) {
      // The claim of parallelism is read from the clocks, never from the size
      // of the wave: a wave is what may run together, not what did.
      var parallel = L.peakParallel(group.tasks, state, Date.now());
      put(host, 'div', T.UI.waveName(group.wave, parallel, L.waveWaitsOf(tasks, group)), 'wave-name');

      group.tasks.forEach(function (task) {
        var onPath = critical.indexOf(task.id) !== -1;
        var row = put(host, 'div', null, 'task task-' + task.status + (onPath ? ' critical' : ''));
        if (onPath) row.title = T.SCREEN.onCriticalPath;
        opener(row, 'task:' + task.id, T.UI.taskAria(task.id), function () { renderBuild(state); tick(); });
        put(row, 'span', task.id, 'id');

        var track = put(row, 'div', null, 'track');
        var fill = put(track, 'div', null, 'fill ' + task.status);
        if (STATUS_COLOR[task.status]) fill.style.background = STATUS_COLOR[task.status];
        put(fill, 'span', task.title, 'nm');

        // Every bar says its status in a word, so no status is told by colour
        // alone — the rule the Таски squares already follow.
        if (L.TASK_ORDER.indexOf(task.status) !== -1) {
          put(fill, 'span', L.label(T.TASK_STATUS, task.status), 'phase');
          var counted = task.status === 'review' || task.status === 'repair' || task.status === 'failed';
          if (counted && closure && closure.defects[task.id]) put(fill, 'span', T.UI.taskDefects(closure.defects[task.id]), 'phase defects');
        } else {
          // A status the contract does not define is printed as it was written,
          // through the same reader that keeps a finding from becoming
          // `[object Object]`. The row keeps its neutral colour: the page does
          // not invent a status, it reports the one it was handed.
          put(fill, 'span', L.lineOf(task.status), 'phase');
        }

        var clock = put(row, 'span', '—', 'mins');
        if (task.startedAt) {
          clock.dataset.from = task.startedAt;
          clock.dataset.until = task.finishedAt || '';
        }

        // The line under the bar is the whole sentence in its text and its
        // title; CSS clips it to one line, so a long counterexample is cut on
        // screen and never in what the page holds.
        var reason = L.taskReasonOf(state, task.id);
        if (reason) {
          var why = reason.kind === 'sent-back'
            ? T.UI.sentBack(reason.text)
            : T.UI.lastRepair(L.label(T.REPAIR_OUTCOME, reason.outcome));
          var whyLine = put(row, 'div', why, 'why ' + reason.kind);
          whyLine.title = why;
        }

        if (openRows['task:' + task.id]) {
          var detail = put(host, 'ul', null, 'detail');
          L.describeTask(state, task.id, lang).forEach(function (line) { put(detail, 'li', line); });
        }
      });
    });
  }

  /**
   * Make a drawn row open and close its detail, by mouse and by keyboard.
   *
   * The row stays a `div` because it holds a block track; a `button` may not.
   * The open state lives in `openRows` under `key`, so the detail survives the
   * redraw every poll performs.
   */
  function opener(row, key, aria, redraw) {
    var open = !!openRows[key];
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    focusKey(row, key);
    row.setAttribute('aria-expanded', open ? 'true' : 'false');
    row.setAttribute('aria-label', aria);
    row.classList.add('opens');
    var flip = function () {
      openRows = L.toggled(openRows, key);
      keepingFocus(redraw);
    };
    row.addEventListener('click', flip);
    row.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      flip();
    });
  }

  /**
   * A heading and its lines, the lines past FOLD_AFTER folded behind a press.
   * Nothing is drawn for an empty list: an empty group is not news.
   */
  function drawGroup(host, key, heading, lines, redraw, nested) {
    if (lines.length === 0) return;
    put(host, nested ? 'h4' : 'h3', T.UI.groupToggle(heading, lines.length), 'group-name');
    var open = !!openRows['group:' + key];
    var list = put(host, 'ul', null, 'group');
    var fold = L.foldOf(lines, open);
    fold.shown.forEach(function (line) { put(list, 'li', line); });
    if (!fold.folds) return;
    var toggle = put(host, 'button',
      open ? T.UI.foldLess : T.UI.foldMore(fold.hidden), 'findings-toggle');
    toggle.type = 'button';
    focusKey(toggle, 'fold:' + key);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.addEventListener('click', function () {
      openRows = L.toggled(openRows, 'group:' + key);
      keepingFocus(redraw);
    });
  }

  /**
   * A whole list behind one press, for a record nobody has to act on — the
   * words heard but not taken, and what was delivered beyond the ask.
   */
  function drawFolded(host, key, heading, lines, redraw) {
    if (lines.length === 0) return;
    var open = !!openRows['group:' + key];
    var toggle = put(host, 'button', T.UI.groupToggle(heading, lines.length), 'findings-toggle');
    toggle.type = 'button';
    focusKey(toggle, 'fold:' + key);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.addEventListener('click', function () {
      openRows = L.toggled(openRows, 'group:' + key);
      keepingFocus(redraw);
    });
    if (!open) return;
    var list = put(host, 'ul', null, 'findings findings-quiet');
    lines.forEach(function (line) { put(list, 'li', line); });
  }

  /**
   * «Ваш ход» sits under the cards while the run is active and first under the
   * header once it is closed, because then it is the whole next step. Moved in
   * the DOM rather than by CSS `order`, so the reading order and the tab order
   * follow what is seen; moved only when its place differs, so a poll moves
   * nothing, and render's keepingFocus hands focus back across the one move.
   */
  function placeHandover(state) {
    var main = el('regions');
    var cards = el('cards');
    // The section that holds #handover; a selector naming the region here would
    // read to the region check as a second place the region is marked.
    var region = el('handover').parentNode;
    if (L.isClosedRun(state)) {
      if (main.firstElementChild !== region) main.insertBefore(region, main.firstElementChild);
    } else if (cards.nextElementSibling !== region) {
      main.insertBefore(region, cards.nextElementSibling);
    }
  }

  function renderHandover(state) {
    var host = clear(el('handover'));
    var handover = L.handoverOf(state);
    if (handover.total === 0) {
      empty(host, T.UI.handoverEmpty);
      return;
    }
    // The whole of what waits on the user, counted by the same function the
    // groups below are drawn from — the retired Долг card counted part of it.
    put(host, 'p', T.UI.handoverTotal(handover.total), 'total');
    var again = function () { renderHandover(state); };
    // Names only: S2 keeps every value out of the state, and this list is
    // where a value would be most tempting to show.
    drawGroup(host, 'emptyEnv', T.SCREEN.variables, handover.emptyEnv, again);
    drawGroup(host, 'placeholders', T.SCREEN.placeholders, handover.placeholders, again);
    drawGroup(host, 'promised', T.SCREEN.promised, handover.promised, again);
    if (handover.oneWayCount > 0) {
      put(host, 'h3', T.UI.groupToggle(T.SCREEN.oneWay, handover.oneWayCount), 'group-name');
      L.ONE_WAY_ORDER.forEach(function (kind) {
        drawGroup(host, 'oneWay:' + kind, L.label(T.ONE_WAY_KIND, kind), handover.oneWay[kind] || [], again, true);
      });
      drawGroup(host, 'oneWay:unknown', T.UI.oneWayUnknown, handover.unknownOneWay, again, true);
    }
    drawGroup(host, 'assumptions', T.SCREEN.assumptions, handover.assumptions, again);
  }

  /**
   * What just happened, newest first, each line with its age.
   *
   * Every decision — which events, in what order, in which words, how many
   * before the fold — is made in the logic block; this only applies it. An
   * age carries its moment in data-at so tick() moves it with the clocks,
   * and every line goes through put, because таск titles are the user's words.
   */
  function renderFeed(state) {
    var host = clear(el('feed'));
    var events = L.feedOf(state);
    if (events.length === 0) {
      empty(host, T.UI.feedEmpty);
      return;
    }
    var register = L.registerOf(state);
    var open = !!openRows['group:feed'];
    var fold = L.foldOf(events, open, L.FEED_SHOWN);
    var list = put(host, 'ul', null, 'feed');
    var now = Date.now();
    fold.shown.forEach(function (event) {
      var item = put(list, 'li');
      put(item, 'span', L.feedLine(event, register, lang), 'line');
      put(item, 'span', L.feedAge(event.at, now, lang), 'age').setAttribute('data-at', String(event.at));
    });
    if (!fold.folds) return;
    var toggle = put(host, 'button', open ? T.UI.foldLess : T.UI.foldMore(fold.hidden), 'findings-toggle');
    toggle.type = 'button';
    focusKey(toggle, 'fold:feed');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.addEventListener('click', function () {
      openRows = L.toggled(openRows, 'group:feed');
      keepingFocus(function () { renderFeed(state); });
    });
  }

  function renderRequirements(state) {
    var host = clear(el('requirements'));
    var counts = L.countRequirements(state.requirements);
    if (counts.total === 0) {
      empty(host, T.UI.noRequirements);
    }

    L.REQUIREMENT_ORDER.forEach(function (status) {
      var row = put(host, 'div', null, 'row coverage coverage-' + status);
      put(row, 'span', L.label(T.REQUIREMENT_STATUS, status), 'name');
      put(row, 'span', counts[status], 'count');
    });
    put(host, 'p', T.UI.requirementsTotal(counts.total), 'total');
    try { T.UI.scopeRows(L.scopeProgressOf(state)).forEach(function (line) { put(host, 'p', line, 'total'); }); }
    catch (error) { put(host, 'p', L.runNotice(state, lang), 'total'); }
    if (state.contractVersion >= 4) {
      try { put(host, 'p', T.UI.verificationRows(L.verificationOf(state)), 'total'); }
      catch (error) { put(host, 'p', L.runNotice(state, lang), 'total'); }
    }
    var closure = null;
    try { closure = L.closureOf(state); } catch (error) { closure = null; }
    if (closure) put(host, 'p', T.UI.readinessRow(closure.readiness), 'total');
    renderRequirementRows(state);
  }

  /**
   * One pressable chip per group the list can show. Pressing one keeps the
   * choice in this browser and folds the list again, so the press under the
   * rows always counts the chip in view rather than the one left behind.
   */
  function drawChips(host, filter, chosen, redraw) {
    var group = put(host, 'div', null, 'chips');
    group.setAttribute('role', 'group');
    group.setAttribute('aria-label', T.UI.requirementFilterAria);
    filter.chips.forEach(function (key) {
      var chip = put(group, 'button', L.filterChipLabel(key, filter.counts[key], lang), 'chip');
      focusKey(chip, 'filter:' + key);
      chip.type = 'button';
      chip.setAttribute('aria-pressed', key === chosen ? 'true' : 'false');
      chip.addEventListener('click', function () {
        keep(REQUIREMENT_FILTER_KEY, key);
        requirementFilter = key;
        if (openRows['group:requirements']) openRows = L.toggled(openRows, 'group:requirements');
        keepingFocus(redraw);
      });
    });
  }

  /**
   * The chips, then one row per требование the chosen chip holds, opening to
   * its chain, then the two folded records below the list. Redrawn on its own
   * when a row opens or a chip is pressed, so the counts above and the
   * explainer beside the heading are left where they are.
   */
  function renderRequirementRows(state) {
    var rows = clear(el('requirement-rows'));
    var folds = clear(el('requirement-folds'));
    var again = function () { renderRequirementRows(state); };
    var untraced = L.untracedOf(state);
    var filter = L.requirementFilterOf(state);
    var list = L.requirementListOf(state, requirementFilter, !!openRows['group:requirements']);
    var byId = {};
    (state.requirements || []).forEach(function (requirement) {
      if (requirement && typeof requirement.id === 'string' && !byId[requirement.id]) byId[requirement.id] = requirement;
    });

    // No требования, no chips: the line above already says none were written.
    if (filter.counts.all > 0) drawChips(rows, filter, list.filter, again);
    if (filter.counts.all > 0 && list.total === 0) empty(rows, T.UI.filterEmpty);

    list.ids.forEach(function (id) {
      var requirement = byId[id];
      var detail = L.requirementDetailOf(state, requirement.id);
      var row = put(rows, 'div', null, 'row req req-' + L.lineOf(requirement.status));
      opener(row, 'req:' + requirement.id, T.UI.requirementAria(requirement.id), again);
      put(row, 'span', requirement.id, 'id');
      var words = put(row, 'span', null, 'name');
      // The user's own words lead; the прогон's English title follows them, or
      // stands alone for a state written before the words were recorded.
      if (detail && detail.quotes.length > 0) put(words, 'span', T.UI.quote(detail.quotes[0]), 'quote');
      if (detail && detail.title) {
        put(words, 'span', detail.title, detail.quotes.length > 0 ? 'title' : 'quote');
      }
      if (untraced.ids.indexOf(requirement.id) !== -1) {
        put(words, 'span', T.SCREEN.untraced, 'untraced untraced-' + untraced.tone);
      }
      // The run's own text, so through put and never as markup.
      var reason = L.requirementReasonOf(requirement);
      if (reason !== null) put(words, 'span', T.UI.requirementReason(reason), 'reason');
      put(row, 'span', L.label(T.REQUIREMENT_STATUS, requirement.status), 'status');
      put(row, 'span', detail && detail.result ? L.label(T.REQUIREMENT_RESULT, detail.result) : '', 'status');

      if (openRows['req:' + requirement.id]) {
        var lines = put(rows, 'ul', null, 'detail');
        L.describeRequirement(state, requirement.id, lang).forEach(function (line) { put(lines, 'li', line); });
      }
    });

    if (list.folds) {
      var open = !!openRows['group:requirements'];
      var toggle = put(rows, 'button', open ? T.UI.foldLess : T.UI.foldAll(list.total), 'findings-toggle');
      toggle.type = 'button';
      focusKey(toggle, 'fold:requirements');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.addEventListener('click', function () {
        openRows = L.toggled(openRows, 'group:requirements');
        keepingFocus(again);
      });
    }

    drawFolded(folds, 'context', T.SCREEN.context,
      L.contextClausesOf(state).map(function (item) { return T.UI.contextLine(item); }), again);
    drawFolded(folds, 'additions', T.SCREEN.additions, L.additionsOf(state), again);
  }

  function renderGates(state) {
    var host = clear(el('gates'));
    var gates = state.gates || [];
    if (gates.length === 0) {
      empty(host, T.UI.noGates);
      return;
    }

    var register = L.registerOf(state);

    gates.forEach(function (storedGate) {
      var gate = storedGate;
      if (state.contractVersion >= 4 && storedGate.id === 'G4') {
        try { gate = Object.assign({}, storedGate, { status: L.verificationOf(state).g4 }); }
        catch (error) { gate = Object.assign({}, storedGate, { status: 'pending' }); }
      }
      var row = put(host, 'div', null, 'row gate gate-' + gate.status);
      put(row, 'span', gate.id, 'id');
      put(row, 'span', L.label(T.STAGE_LABEL, L.GATE_AFTER[gate.id]) || '', 'name');
      put(row, 'span', L.label(T.GATE_STATUS, gate.status), 'status');
      drawFindings(gate);
      // The brief's coverage belongs to the check after the specification:
      // that is the gate which asks whether every live требование reached it.
      if (gate.id === 'G2') put(host, 'p', T.UI.coverageLine(L.coverage(state.requirements)), 'note coverage-line');
    });

    function drawFindings(gate) {
      var view = L.findingsView(gate);
      if (!view.show) return;

      var findings = gate.findings || [];
      var drawList = function () {
        var list = put(host, 'ul', null, 'findings findings-' + view.tone);
        findings.forEach(function (finding) { put(list, 'li', L.lineOf(finding)); });
      };

      if (!view.folded) { drawList(); return; }

      // The region is cleared and rebuilt every poll, so an opened list is
      // remembered by gate id rather than by the node that held it. Re-folding
      // on the redraw was the other option and it is the wrong one: the list
      // would snap shut every two seconds, which is less time than it takes to
      // read one finding.
      var toggle = put(host, 'button', L.findingsLine(view.count, register, lang), 'findings-toggle');
      toggle.type = 'button';
      focusKey(toggle, 'findings:' + gate.id);
      toggle.setAttribute('aria-expanded', openFindings[gate.id] ? 'true' : 'false');
      toggle.addEventListener('click', function () {
        openFindings[gate.id] = !openFindings[gate.id];
        keepingFocus(function () { renderGates(state); });
      });
      if (openFindings[gate.id]) drawList();
    }
  }

  /**
   * Clocks redraw every second; the state is only re-read on the poll.
   *
   * Every clock on the page is a `[data-from]` element, so one loop moves the
   * run, the stage and each таск. They show working time — a прогон left for a
   * day does not report a day of work — and the calendar span is printed beside
   * the run clock whenever the two have parted company.
   */
  function tick() {
    if (!lastGood) return;
    var now = Date.now();

    var nodes = document.querySelectorAll('[data-from]');
    for (var i = 0; i < nodes.length; i += 1) {
      var node = nodes[i];
      var from = node.dataset.from;
      if (!from) { node.textContent = '—'; continue; }
      var until = node.dataset.until || undefined;
      node.textContent = L.formatDuration(L.worked(from, lastGood, now, until, marks));
    }

    // The feed's ages are calendar time, not worked time, so they read their
    // own moment and nothing else; they move here, with the clocks.
    var ages = document.querySelectorAll('[data-at]');
    for (var j = 0; j < ages.length; j += 1) {
      ages[j].textContent = L.feedAge(Number(ages[j].dataset.at), now, lang);
    }

    var span = L.elapsed(lastGood.startedAt, lastGood, now);
    var active = L.worked(lastGood.startedAt, lastGood, now, undefined, marks);
    var calendar = el('run-calendar');
    // Printed only when a pause actually happened: an identical second number
    // teaches the reader to ignore the line it will one day need.
    if (span !== null && active !== null && span - active > 60000) {
      calendar.textContent = T.UI.calendar(L.formatDuration(span));
      calendar.hidden = false;
    } else {
      calendar.hidden = true;
    }
  }

  /**
   * The i beside each region, and the single popover all thirteen fill.
   *
   * One node rather than thirteen. Moving it is what closes the previous
   * explanation, so "at most one open" needs no state to keep it true, and the
   * cards never shift: a reader stays looking at the number while reading about
   * it. Filling it through `put` keeps the textContent rule by construction,
   * and that matters here — the texts quote таск titles, which are the user's
   * own words.
   */
  function mountExplainers() {
    var box = el('explain');
    var open = null;

    function close() {
      open = null;
      box.hidden = true;
    }

    // One key space for two kinds of thing: a region is named by its own key,
    // a стадия by `stage:<id>`. That is what lets close, refill and reopen stay
    // one code path rather than three that have to agree.
    function linesFor(key) {
      var now = Date.now();
      var register = L.registerOf(lastGood);
      return key.indexOf('stage:') === 0
        ? L.explainStage(key.slice(6), lastGood, now, marks, register, lang)
        : L.explain(key, lastGood, now, marks, register, lang);
    }

    function fill(key) {
      clear(box);
      linesFor(key).forEach(function (line, index) {
        put(box, 'p', line, index === 0 ? 'what' : null);
      });
    }

    function toggle(key, button) {
      if (open === key) return close();
      open = key;
      fill(key);
      place(button);
    }

    function place(button) {
      box.hidden = false;
      box.style.left = '0px';
      var rect = button.getBoundingClientRect();
      var left = rect.left + window.scrollX;
      // Kept inside the viewport: against the right-hand edge the popover would
      // open past it and need sideways scrolling to read.
      var edge = window.scrollX + document.documentElement.clientWidth - 8;
      var overflow = (left + box.offsetWidth) - edge;
      if (overflow > 0) left = Math.max(8, left - overflow);
      box.style.top = (rect.bottom + window.scrollY + 6) + 'px';
      box.style.left = left + 'px';
    }

    var regions = document.querySelectorAll('[data-region]');
    for (var i = 0; i < regions.length; i += 1) {
      (function (region) {
        var key = region.getAttribute('data-region');
        // Most regions are titled by an h2 and the i belongs beside it. The
        // dials are not titled at all — they are the header's own row of chips
        // — so the region names itself and carries the button directly.
        var heading = region.querySelector('h2');
        if (!heading && !region.getAttribute('data-region-label')) return;
        var button = put(heading || region, 'button', 'i', 'info');
        button.type = 'button';
        focusKey(button, 'region:' + key);
        // Named at paint time rather than here: the heading is empty until a
        // language is in force, and the name has to follow a reader who
        // switches languages with the popover already mounted.
        button.setAttribute('data-aria-region', key);
        button.setAttribute('data-explains', key);
        button.addEventListener('click', function (event) {
          event.stopPropagation();
          toggle(key, button);
        });
      }(regions[i]));
    }

    document.addEventListener('click', function (event) {
      if (open && !box.contains(event.target)) close();
    });
    document.addEventListener('keydown', function (event) {
      if (open && event.key === 'Escape') close();
    });

    // An explanation is about the прогон, so it follows it: a popover left open
    // while the state moves is refilled rather than left describing a moment
    // that has passed.
    //
    // A стадия's button is a different node after every poll, so the popover
    // cannot hold on to the one it was opened from. It re-finds the button by
    // key and re-places itself over it — and closes when the row is gone, which
    // is the honest thing to do with an explanation of something no longer on
    // the screen. A region's heading is drawn once and needs neither.
    refillOpenExplainer = function () {
      if (!open) return;
      fill(open);
      if (open.indexOf('stage:') !== 0) return;
      var button = document.querySelector('[data-explains="' + open + '"]');
      if (!button) return close();
      place(button);
    };

    toggleExplainer = toggle;
  }

  mountExplainers();
  mountSwitches();

  // The theme before anything else, so a reader who chose one never sees the
  // other flash past. Absent a choice, no attribute is set and the stylesheet's
  // media query decides — which is the state the page ships in.
  useTheme(kept(THEME_KEY, THEMES));

  // A language before the first state: the headings are empty in the markup, so
  // a page whose state never loads would otherwise show a column of blank
  // titles above its error message.
  useLanguage(storedLanguage() || 'ru');

  // The snapshot first, so a page opened without an address shows the прогон
  // instead of an error; then the file, which is what makes it move.
  if (L.isStateShape(globalThis.MAESTRO_SNAPSHOT)) apply(globalThis.MAESTRO_SNAPSHOT);
  applyValidation();

  poll();
  pollTimer = setInterval(poll, POLL_MS);
  setInterval(tick, TICK_MS);
})();
</script>

</body>
</html>
